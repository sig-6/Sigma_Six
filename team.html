<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Level 1 Direct Referrals</title>

  <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

  <style>
    :root {
      --primary: #5b5ce2;
      --muted: #6b7280;
      --card: #fff;
      --border: #e5e7eb;
      --green: #16804a;
      --red: #c0392b;
      --background: #f7f8fc;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: var(--background);
      color: #202338;
      font-family: Arial, sans-serif;
    }

    .container { max-width: 1100px; margin: auto; }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 24px;
    }

    a { color: var(--primary); text-decoration: none; }

    button {
      border: 0;
      border-radius: 8px;
      padding: 10px 14px;
      background: var(--primary);
      color: #fff;
      font: inherit;
      cursor: pointer;
    }

    button:disabled { opacity: .6; cursor: wait; }

    .header { margin-bottom: 20px; }
    .header h1 { margin: 0; font-size: 26px; }
    .header p { margin: 5px 0 0; color: var(--muted); }

    .stats {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 14px;
      margin-bottom: 20px;
    }

    .stat, .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      box-shadow: 0 3px 14px #20233808;
    }

    .stat { padding: 16px; }
    .stat-label { color: var(--muted); font-size: 13px; }
    .stat-value { margin-top: 7px; font-size: 22px; font-weight: 700; }
    .stat-sub { color: var(--muted); font-size: 13px; }

    .card { overflow: hidden; }
    .card-title { padding: 16px; font-weight: 700; border-bottom: 1px solid var(--border); }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; white-space: nowrap; }
    th, td { padding: 12px 14px; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-size: 12px; }
    .addr { font-family: monospace; }

    .badge { padding: 4px 9px; border-radius: 20px; font-size: 12px; }
    .badge.active { color: var(--green); background: #e7f6ef; }
    .badge.inactive { color: var(--red); background: #fff0f0; }

    .message { padding: 28px 16px; text-align: center; color: var(--muted); }
    .progress-box { max-width: 400px; margin: 14px auto 0; }
    .progress-track { height: 8px; background: var(--border); border-radius: 10px; overflow: hidden; }
    .progress-bar { width: 0; height: 100%; background: var(--primary); transition: width .2s; }
    .progress-text { margin-top: 7px; font-size: 13px; }

    @media (max-width: 700px) {
      body { padding: 14px; }
      .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .header h1 { font-size: 22px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <div class="top-bar">
      <a href="index.html">← Back</a>
      <div>
        <button id="connectBtn" type="button">Connect Wallet</button>
        <button id="refreshBtn" type="button" disabled>Refresh</button>
      </div>
    </div>

    <header class="header">
      <h1>LEVEL 1 DIRECTS</h1>
      <p>Recent Buy events — 5,000-block test scan</p>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Total Directs</div>
        <div class="stat-value" id="total">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Active</div>
        <div class="stat-value" id="active">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Holdings</div>
        <div class="stat-value" id="holdings">0</div>
        <div class="stat-sub" id="usdt">$0.00 estimated</div>
      </div>
      <div class="stat">
        <div class="stat-label">Buy Rate</div>
        <div class="stat-value" id="rate">0.0000</div>
      </div>
    </section>

    <section class="card">
      <div class="card-title">Your Direct Referrals</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Wallet</th>
              <th>Balance</th>
              <th>Estimated USDT</th>
              <th>Last Buy</th>
              <th>Directs</th>
              <th>Status</th>
            </tr>
          </thead>
          <tbody id="rows">
            <tr><td colspan="7" class="message">Connect your wallet to load data.</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <script>
    const CONTRACT_ADDRESS = "0xaF215838d156F7d348A6d56cA962cbC680A2153F";
    const DEPLOYMENT_BLOCK = 96552904;

    const RPC_URLS = [
      "https://polygon.drpc.org",
      "https://polygon.llamarpc.com",
      "https://rpc.ankr.com/polygon"
    ];

    const BLOCKS_TO_SCAN = 5000;
    const BLOCK_CHUNK = 100;

    const ABI = [
      "function getCurrentBuyRate() view returns (uint256)",
      "function balanceOf(address) view returns (uint256)",
      "function decimals() view returns (uint8)",
      "function users(address) view returns (address upline, uint256 directCount, uint256 lastBuyTimestamp, uint256, uint256, uint256, bool)",
      "event Buy(address indexed user, uint256 amount, uint256 rate, uint256 usdtSpent)"
    ];

    const iface = new ethers.Interface(ABI);
    const buyTopic = iface.getEvent("Buy").topicHash;
    const $ = id => document.getElementById(id);

    let readProvider;
    let contract;
    let walletAddress = "";
    let tokenDecimals = 18;
    let buyRate = 0;

    function pause(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function setMessage(text) {
      $("rows").innerHTML =
        `<tr><td colspan="7" class="message">${escapeHTML(text)}</td></tr>`;
    }

    function escapeHTML(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        '"': "&quot;",
        "'": "&#39;"
      })[char]);
    }

    function setProgress(percent, text) {
      $("rows").innerHTML = `
        <tr><td colspan="7" class="message">
          <div>${escapeHTML(text)}</div>
          <div class="progress-box">
            <div class="progress-track">
              <div class="progress-bar" id="progressBar"></div>
            </div>
            <div class="progress-text" id="progressText"></div>
          </div>
        </td></tr>`;

      const bar = $("progressBar");
      const label = $("progressText");
      if (bar) bar.style.width = `${percent}%`;
      if (label) label.textContent = text;
    }

    async function postRPC(url, method, params) {
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          jsonrpc: "2.0",
          id: Date.now(),
          method,
          params
        })
      });

      const body = await response.json().catch(() => ({}));

      if (!response.ok || body.error) {
        throw new Error(body.error?.message || `HTTP ${response.status}`);
      }

      return body.result;
    }

    async function rpcWithFallback(method, params) {
      const errors = [];

      for (const url of RPC_URLS) {
        try {
          return await postRPC(url, method, params);
        } catch (error) {
          console.warn(`${method} failed on ${url}:`, error.message);
          errors.push(`${url}: ${error.message}`);
        }
      }

      throw new Error(`${method} failed on all RPCs. ${errors.join(" | ")}`);
    }

    async function getBlockNumber() {
      const hex = await rpcWithFallback("eth_blockNumber", []);
      return Number(BigInt(hex));
    }

    async function scanBuyEvents(fromBlock, toBlock) {
      const found = new Set();
      const totalRanges = Math.ceil((toBlock - fromBlock + 1) / BLOCK_CHUNK);

      for (let start = fromBlock, index = 0; start <= toBlock; start += BLOCK_CHUNK) {
        const end = Math.min(start + BLOCK_CHUNK - 1, toBlock);

        const logs = await rpcWithFallback("eth_getLogs", [{
          address: CONTRACT_ADDRESS,
          fromBlock: "0x" + start.toString(16),
          toBlock: "0x" + end.toString(16),
          topics: [buyTopic]
        }]);

        for (const log of logs) {
          try {
            const parsed = iface.parseLog({
              topics: log.topics,
              data: log.data
            });

            const buyer = parsed?.args?.user;
            if (buyer) found.add(buyer.toLowerCase());
          } catch (error) {
            console.warn("Could not parse Buy log:", error);
          }
        }

        index++;
        setProgress(
          Math.floor(index / totalRanges * 65),
          `Buy events scan: ${index} / ${totalRanges} ranges`
        );

        await pause(120);
      }

      return [...found];
    }

    async function connectWallet() {
      if (!window.ethereum) {
        alert("MetaMask ya compatible wallet install/open karein.");
        return;
      }

      $("connectBtn").disabled = true;

      try {
        const walletProvider = new ethers.BrowserProvider(window.ethereum);
        let network = await walletProvider.getNetwork();

        if (Number(network.chainId) !== 137) {
          await window.ethereum.request({
            method: "wallet_switchEthereumChain",
            params: [{ chainId: "0x89" }]
          });
          network = await walletProvider.getNetwork();
        }

        if (Number(network.chainId) !== 137) {
          throw new Error("Wallet Polygon network par nahi hai.");
        }

        const accounts = await walletProvider.send("eth_requestAccounts", []);
        if (!accounts.length) throw new Error("Wallet account nahi mila.");

        walletAddress = accounts[0].toLowerCase();
        $("connectBtn").textContent =
          walletAddress.slice(0, 6) + "..." + walletAddress.slice(-4);

        const networkId = await getBlockNumber();
        console.log("Polygon block:", networkId);

        // Read calls use the first working RPC.
        for (const url of RPC_URLS) {
          try {
            const candidate = new ethers.JsonRpcProvider(
              url,
              137,
              { staticNetwork: true }
            );
            await candidate.getBlockNumber();
            readProvider = candidate;
            break;
          } catch (error) {
            console.warn("Read RPC failed:", url, error);
          }
        }

        if (!readProvider) throw new Error("Koi Polygon RPC connect nahi hua.");

        contract = new ethers.Contract(CONTRACT_ADDRESS, ABI, readProvider);

        try {
          tokenDecimals = Number(await contract.decimals());
        } catch (error) {
          console.warn("decimals() read nahi hua; 18 use kar rahe hain.");
          tokenDecimals = 18;
        }

        $("refreshBtn").disabled = false;
        await loadData();
      } catch (error) {
        console.error("Connect/load failed:", error);
        setMessage(error.message || String(error));
        alert("Error: " + (error.shortMessage || error.message || error));
      } finally {
        $("connectBtn").disabled = false;
      }
    }

    async function loadData() {
      try {
        const currentBlock = await getBlockNumber();

        if (currentBlock < DEPLOYMENT_BLOCK) {
          throw new Error(
            `Current block ${currentBlock} deployment block ${DEPLOYMENT_BLOCK} se kam hai.`
          );
        }

        const fromBlock = Math.max(
          DEPLOYMENT_BLOCK,
          currentBlock - BLOCKS_TO_SCAN
        );

        console.log(`Scanning ${fromBlock} to ${currentBlock}`);
        setProgress(0, "Buy events scan shuru ho raha hai...");

        try {
          const rateValue = await contract.getCurrentBuyRate();
          buyRate = Number(ethers.formatUnits(rateValue, 6));
          $("rate").textContent = buyRate.toFixed(4);
        } catch (error) {
          console.error("Buy rate read failed:", error);
          $("rate").textContent = "Unavailable";
        }

        const buyers = await scanBuyEvents(fromBlock, currentBlock);
        console.log("Unique buyers:", buyers.length);

        if (!buyers.length) {
          setMessage("Is block range mein Buy events nahi mile.");
          return;
        }

        const directs = [];

        for (let i = 0; i < buyers.length; i++) {
          const address = buyers[i];

          try {
            const info = await contract.users(address);
            const upline = String(info.upline).toLowerCase();

            if (upline === walletAddress) {
              const balanceBN = await contract.balanceOf(address);
              const balance = Number(
                ethers.formatUnits(balanceBN, tokenDecimals)
              );
              const estimatedUSDT = balance * buyRate * 0.91;

              directs.push({
                address,
                balance,
                estimatedUSDT,
                directCount: Number(info.directCount),
                lastBuy: Number(info.lastBuyTimestamp)
              });
            }
          } catch (error) {
            console.error("Could not read user:", address, error);
          }

          if ((i + 1) % 10 === 0 || i + 1 === buyers.length) {
            setProgress(
              65 + Math.floor((i + 1) / buyers.length * 35),
              `Wallets checked: ${i + 1} / ${buyers.length}`
            );
          }

          await pause(50);
        }

        directs.sort((a, b) => b.balance - a.balance);
        renderTable(directs);
      } catch (error) {
        console.error("Load failed:", error);
        setMessage("Load failed: " + (error.message || String(error)));
      }
    }

    function renderTable(directs) {
      const totalBalance = directs.reduce((sum, item) => sum + item.balance, 0);
      const totalUSDT = directs.reduce((sum, item) => sum + item.estimatedUSDT, 0);
      const activeCount = directs.filter(item => item.estimatedUSDT >= 10).length;

      $("total").textContent = directs.length;
      $("active").textContent = activeCount;
      $("holdings").textContent = totalBalance.toFixed(2);
      $("usdt").textContent = "$" + totalUSDT.toFixed(2) + " estimated";

      if (!directs.length) {
        setMessage("Buy events mile, lekin is wallet ke direct referrals match nahi hue.");
        return;
      }

      $("rows").innerHTML = directs.map((item, index) => {
        const date = item.lastBuy
          ? new Date(item.lastBuy * 1000).toLocaleDateString("en-IN")
          : "—";

        const active = item.estimatedUSDT >= 10;
        const shortAddress = item.address.slice(0, 7) + "..." + item.address.slice(-5);

        return `
          <tr>
            <td>${index + 1}</td>
            <td>
              <span class="addr">${escapeHTML(shortAddress)}</span><br>
              <button type="button" onclick="copyAddress('${item.address}')">Copy</button>
              <a href="https://polygonscan.com/address/${item.address}"
                 target="_blank" rel="noopener">Explorer</a>
            </td>
            <td>${item.balance.toFixed(2)}</td>
            <td>$${item.estimatedUSDT.toFixed(2)}</td>
            <td>${escapeHTML(date)}</td>
            <td>${item.directCount}</td>
            <td><span class="badge ${active ? "active" : "inactive"}">
              ${active ? "Active" : "Inactive"}
            </span></td>
          </tr>`;
      }).join("");
    }

    async function copyAddress(address) {
      try {
        await navigator.clipboard.writeText(address);
      } catch (error) {
        alert("Address manually copy karein: " + address);
      }
    }

    async function refreshData() {
      if (!contract || !walletAddress) {
        await connectWallet();
        return;
      }

      $("refreshBtn").disabled = true;
      try {
        await loadData();
      } finally {
        $("refreshBtn").disabled = false;
      }
    }

    $("connectBtn").addEventListener("click", connectWallet);
    $("refreshBtn").addEventListener("click", refreshData);

    if (window.ethereum) {
      window.ethereum.on("accountsChanged", () => location.reload());
      window.ethereum.on("chainChanged", () => location.reload());
    }
  </script>
</body>
</html>
