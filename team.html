<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SIGMA SIX | Level 1 Directs</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #9d4edd;
            --bg: #0a0b10;
            --text: #ffffff;
            --gradient: linear-gradient(90deg, #00ffcc, #9d4edd, #ff2a6d, #00ffcc);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
        .rainbow-border { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: var(--gradient); background-size: 400% 400%; animation: rainbow 8s ease infinite; z-index: 1000; }
        @keyframes rainbow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .container { max-width: 1100px; margin: 0 auto; padding: 16px; }
        .connect-btn { position: fixed; top: 16px; right: 16px; background: linear-gradient(90deg, var(--primary), var(--secondary)); color: #000; border: none; border-radius: 14px; padding: 11px 22px; font-weight: 800; font-size: 14px; cursor: pointer; z-index: 1001; display: flex; align-items: center; gap: 8px; }
        .connect-btn.connected { background: rgba(0,255,204,0.12); color: var(--primary); border: 1px solid var(--primary); }
        .header { text-align: center; margin: 50px 0 25px; }
        .header h1 { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 32px; font-weight: 800; }
        .header p { color: #aaa; margin-top: 6px; font-size: 14px; }
        .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .stat { background: rgba(22,24,33,0.85); border-radius: 14px; padding: 16px; border: 1px solid rgba(0,255,204,0.12); }
        .stat-label { color: #888; font-size: 12px; margin-bottom: 6px; display: flex; align-items: center; gap: 6px; }
        .stat-label i { color: var(--primary); }
        .stat-value { font-size: 24px; font-weight: 800; color: var(--primary); }
        .stat-sub { font-size: 12px; color: #777; margin-top: 2px; }
        .card { background: rgba(22,24,33,0.85); border-radius: 18px; padding: 18px; border: 1px solid rgba(0,255,204,0.12); }
        .card-title { color: var(--primary); font-size: 18px; font-weight: 700; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
        .table-wrap { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 650px; }
        th { padding: 12px 10px; text-align: left; font-size: 12px; color: var(--primary); text-transform: uppercase; border-bottom: 2px solid rgba(0,255,204,0.2); }
        td { padding: 12px 10px; border-bottom: 1px solid rgba(45,47,62,0.35); font-size: 13px; }
        tr:hover td { background: rgba(255,255,255,0.03); }
        .addr { font-family: monospace; background: rgba(255,255,255,0.05); padding: 4px 8px; border-radius: 6px; font-size: 12px; }
        .badge { padding: 3px 9px; border-radius: 10px; font-size: 11px; font-weight: 700; }
        .active { background: rgba(0,255,204,0.15); color: #00ffcc; }
        .inactive { background: rgba(255,170,0,0.15); color: #ffaa00; }
        .loading, .empty { text-align: center; padding: 45px 15px; color: var(--primary); }
        .progress-box { background: rgba(0,255,204,0.08); border-radius: 12px; padding: 14px; max-width: 380px; margin: 12px auto; border: 1px solid rgba(0,255,204,0.2); }
        .progress-bar { height: 7px; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 4px; width: 0%; transition: width 0.3s; }
        .progress-text { color: #aaa; font-size: 14px; margin-top: 10px; text-align: center; font-weight: 600; }
        .back { display: inline-flex; align-items: center; gap: 7px; color: var(--primary); text-decoration: none; font-weight: 600; padding: 9px 14px; border-radius: 11px; background: rgba(0,255,204,0.1); border: 1px solid rgba(0,255,204,0.25); font-size: 13px; }
        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            color: var(--primary);
            background: rgba(0,255,204,0.1);
            border: 1px solid rgba(0,255,204,0.25);
            padding: 9px 16px;
            border-radius: 11px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .refresh-btn:hover { background: rgba(0,255,204,0.2); }
        .refresh-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .refresh-btn i.spinning { animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; flex-wrap: wrap; gap: 8px; }
        @media (max-width: 600px) {
            .connect-btn { position: relative; top: auto; right: auto; width: 100%; justify-content: center; margin-bottom: 12px; }
            .header h1 { font-size: 24px; }
            .stat-value { font-size: 20px; }
        }
    </style>
</head>
<body>
    <div class="rainbow-border"></div>

    <button class="connect-btn" id="connectBtn" onclick="connectWallet()">
        <i class="fas fa-wallet"></i> <span id="btn-text">Connect Wallet</span>
    </button>

    <div class="container">
        <div class="top-bar">
            <a href="index.html" class="back"><i class="fas fa-arrow-left"></i> Back</a>
            <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">
                <i class="fas fa-sync-alt" id="refreshIcon"></i> Refresh
            </button>
        </div>

        <div class="header">
            <h1>LEVEL 1 DIRECTS</h1>
            <p>Last 30 Days</p>
        </div>

        <div class="stats">
            <div class="stat">
                <div class="stat-label"><i class="fas fa-users"></i> Total Directs</div>
                <div class="stat-value" id="total">0</div>
            </div>
            <div class="stat">
                <div class="stat-label"><i class="fas fa-crown"></i> Active</div>
                <div class="stat-value" id="active">0</div>
            </div>
            <div class="stat">
                <div class="stat-label"><i class="fas fa-coins"></i> Holdings</div>
                <div class="stat-value" id="sigma">0</div>
                <div class="stat-sub" id="usdt">$0.00</div>
            </div>
            <div class="stat">
                <div class="stat-label"><i class="fas fa-chart-line"></i> Buy Rate</div>
                <div class="stat-value" id="rate">0.0000</div>
            </div>
        </div>

        <div class="card">
            <div class="card-title"><i class="fas fa-sitemap"></i> Your Direct Referrals</div>
            <div class="table-wrap">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Wallet</th>
                            <th>Balance</th>
                            <th>USDT</th>
                            <th>Joined</th>
                            <th>Directs</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="body">
                        <tr><td colspan="7" class="loading"><i class="fas fa-wallet"></i><br>Connect wallet</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const CONTRACT = "0xaF215838d156F7d348A6d56cA962cbC680A2153F";
        
        // Backup RPCs (If MetaMask fails)
        const RPCS = [
            "https://polygon.api.onfinality.io/public",
            "https://polygon.drpc.org",
            "https://1rpc.io/matic",
            "https://polygon.publicnode.com"
        ];
        
        const ABI = [
            "function getCurrentBuyRate() view returns (uint256)",
            "function balanceOf(address) view returns (uint256)",
            "function decimals() view returns (uint8)",
            "function users(address) view returns (address upline, uint256 directCount, uint256 lastBuyTimestamp, uint256, uint256, uint256, bool)",
            "event Buy(address indexed user, uint256 amount, uint256 rate, uint256 usdtSpent)"
        ];

        let readProvider, readContract, userAddress;
        let tokenDecimals = 18;
        let directs = [];
        let buyRate = 0, sellRate = 0;
        let buyFilter = null;

        const CHUNK = 2500;
        const DAYS = 30;
        const BLOCKS = Math.floor(DAYS * 43000);
        const BATCH_SIZE = 12;

        function showLoad(msg) {
            document.getElementById('body').innerHTML = `
                <tr><td colspan="7" class="loading">
                    <i class="fas fa-spinner fa-spin" style="font-size:24px"></i><br>
                    <div class="progress-box">
                        <div class="progress-bar" id="bar"></div>
                        <div class="progress-text" id="txt">${msg}</div>
                    </div>
                </td></tr>`;
        }

        function prog(p, t) {
            const b = document.getElementById('bar');
            const x = document.getElementById('txt');
            if (b) b.style.width = Math.min(100, Math.max(0, p)) + '%';
            if (x) x.textContent = t;
        }

        function showError(msg) {
            document.getElementById('body').innerHTML = `
                <tr><td colspan="7" class="empty">
                    <i class="fas fa-exclamation-triangle"></i><br>
                    ${msg}<br>
                    <small style="color:#888">Try refreshing the page.</small>
                </td></tr>`;
        }

        // 🔥 FIX: Use MetaMask as primary provider to bypass CORS/Public RPC limits
        async function getRPC() {
            if (window.ethereum) {
                try {
                    const p = new ethers.BrowserProvider(window.ethereum);
                    await p.getBlockNumber();
                    console.log("✅ Using MetaMask as RPC Provider");
                    return p;
                } catch (e) {
                    console.warn("❌ MetaMask RPC failed, trying backups...");
                }
            }

            for (const url of RPCS) {
                try {
                    const p = new ethers.JsonRpcProvider(url, 137, { staticNetwork: true });
                    await p.getBlockNumber();
                    console.log("✅ Backup RPC connected:", url);
                    return p;
                } catch (e) {
                    console.warn("❌ Backup RPC failed:", url, e.message);
                }
            }
            throw new Error("All RPC endpoints failed. Please check your internet connection.");
        }

        async function connectWallet() {
            if (!window.ethereum) return alert("Please install MetaMask or Trust Wallet");
            try {
                const provider = new ethers.BrowserProvider(window.ethereum);
                const net = await provider.getNetwork();
                
                // Force switch to Polygon
                if (Number(net.chainId) !== 137) {
                    await window.ethereum.request({
                        method: 'wallet_switchEthereumChain',
                        params: [{ chainId: '0x89' }]
                    });
                }
                
                const accounts = await provider.send("eth_requestAccounts", []);
                userAddress = accounts[0].toLowerCase();

                readProvider = await getRPC();
                readContract = new ethers.Contract(CONTRACT, ABI, readProvider);
                buyFilter = readContract.filters.Buy();

                try {
                    tokenDecimals = Number(await readContract.decimals());
                    console.log("Token decimals:", tokenDecimals);
                } catch (e) {
                    console.warn("decimals() failed, assuming 18");
                    tokenDecimals = 18;
                }

                document.getElementById('btn-text').textContent = userAddress.slice(0, 6) + '...' + userAddress.slice(-4);
                document.getElementById('connectBtn').classList.add('connected');

                await loadData();
            } catch (err) {
                console.error(err);
                alert("Connection failed: " + (err.message || err));
            }
        }

        async function refreshData() {
            if (!userAddress || !readContract) {
                return connectWallet();
            }

            const btn = document.getElementById('refreshBtn');
            const icon = document.getElementById('refreshIcon');

            btn.disabled = true;
            icon.classList.add('spinning');

            try {
                await loadData();
            } catch (err) {
                console.error("Refresh failed:", err);
            } finally {
                btn.disabled = false;
                icon.classList.remove('spinning');
            }
        }

        async function loadData() {
            showLoad("1 / 3  Starting...");

            try {
                const currentBlock = await readProvider.getBlockNumber();
                const fromBlock = Math.max(0, currentBlock - BLOCKS);

                console.log("Scanning from", fromBlock, "to", currentBlock);

                try {
                    const rateBN = await readContract.getCurrentBuyRate();
                    buyRate = parseFloat(ethers.formatUnits(rateBN, 6));
                    sellRate = buyRate * 0.91;
                } catch (e) {
                    console.warn("Rate fetch failed", e);
                }
                document.getElementById('rate').textContent = buyRate.toFixed(4);

                const buyers = new Set();
                let from = fromBlock;

                while (from <= currentBlock) {
                    const to = Math.min(from + CHUNK - 1, currentBlock);
                    let success = false;
                    let retries = 3;

                    while (retries > 0 && !success) {
                        try {
                            const events = await readContract.queryFilter(buyFilter, from, to);
                            events.forEach(e => {
                                if (e.args && e.args.user) {
                                    buyers.add(e.args.user.toLowerCase());
                                }
                            });
                            success = true;
                        } catch (err) {
                            retries--;
                            console.warn("Retry chunk", from, to, err.message);
                            await new Promise(r => setTimeout(r, 1000));
                        }
                    }

                    const percent = ((from - fromBlock) / (currentBlock - fromBlock + 1)) * 65;
                    prog(percent, `1 / 3  Scanning... ${Math.floor(percent)}%`);
                    from = to + 1;
                    await new Promise(r => setTimeout(r, 100));
                }

                console.log("Total buyers found:", buyers.size);
                prog(70, "2 / 3  Finding your directs...");

                const list = Array.from(buyers);
                directs = [];

                for (let i = 0; i < list.length; i += BATCH_SIZE) {
                    const batch = list.slice(i, i + BATCH_SIZE);

                    await Promise.all(batch.map(async (addr) => {
                        try {
                            const userInfo = await readContract.users(addr);
                            const upline = (userInfo.upline || "").toLowerCase();

                            if (upline === userAddress) {
                                const balBN = await readContract.balanceOf(addr);
                                const balance = parseFloat(ethers.formatUnits(balBN, tokenDecimals));
                                const usdtValue = balance * sellRate;

                                directs.push({
                                    address: addr,
                                    balance: balance,
                                    usdt: usdtValue,
                                    active: usdtValue >= 10,
                                    directs: Number(userInfo.directCount || 0),
                                    joined: Number(userInfo.lastBuyTimestamp || 0)
                                });
                            }
                        } catch (e) {
                            console.warn("user lookup failed", addr, e.message);
                        }
                    }));

                    const p = 70 + ((i / list.length) * 28);
                    prog(p, `2 / 3  Checking... ${Math.floor(p)}%`);
                    await new Promise(r => setTimeout(r, 60));
                }

                prog(100, "3 / 3  Done");
                console.log("Directs found:", directs.length);

                directs.sort((a, b) => b.balance - a.balance);
                renderTable();

            } catch (err) {
                console.error("Load error:", err);
                showError(err.message || 'Unknown error');
            }
        }

        function renderTable() {
            const total = directs.length;
            const activeCount = directs.filter(d => d.active).length;
            const totalSigma = directs.reduce((s, d) => s + d.balance, 0);
            const totalUsdt = directs.reduce((s, d) => s + d.usdt, 0);

            document.getElementById('total').textContent = total;
            document.getElementById('active').textContent = activeCount;
            document.getElementById('sigma').textContent = totalSigma.toFixed(2);
            document.getElementById('usdt').textContent = '$' + totalUsdt.toFixed(2);

            const tbody = document.getElementById('body');

            if (total === 0) {
                tbody.innerHTML = `
                    <tr><td colspan="7" class="empty">
                        <i class="fas fa-users-slash"></i><br>
                        No direct referrals found<br>
                        <small style="color:#777">in last 30 days</small>
                    </td></tr>`;
                return;
            }

            let html = '';
            directs.forEach((d, i) => {
                const date = d.joined > 0
                    ? new Date(d.joined * 1000).toLocaleDateString('en-IN', { day: '2-digit', month: 'short', year: 'numeric' })
                    : '—';

                html += `
                <tr>
                    <td>${i + 1}</td>
                    <td>
                        <span class="addr">${d.address.slice(0, 7)}...${d.address.slice(-5)}</span>
                        <div style="margin-top:3px;font-size:11px">
                            <i class="fas fa-copy" style="cursor:pointer;margin-right:8px" onclick="navigator.clipboard.writeText('${d.address}')"></i>
                            <i class="fas fa-external-link-alt" style="cursor:pointer" onclick="window.open('https://polygonscan.com/address/${d.address}','_blank')"></i>
                        </div>
                    </td>
                    <td style="color:var(--primary);font-weight:700">${d.balance.toFixed(2)}</td>
                    <td>$${d.usdt.toFixed(2)}</td>
                    <td>${date}</td>
                    <td>${d.directs}</td>
                    <td><span class="badge ${d.active ? 'active' : 'inactive'}">${d.active ? 'Active' : 'Inactive'}</span></td>
                </tr>`;
            });

            tbody.innerHTML = html;
        }

        window.addEventListener('load', async () => {
            if (!window.ethereum) return;
            try {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length > 0) connectWallet();
            } catch (e) {}

            window.ethereum.on('accountsChanged', (accounts) => {
                if (accounts.length === 0) {
                    location.reload();
                } else if (accounts[0].toLowerCase() !== userAddress) {
                    connectWallet();
                }
            });
            window.ethereum.on('chainChanged', () => location.reload());
        });
    </script>
</body>
</html>
