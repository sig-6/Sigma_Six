<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SIGMA SIX | Direct Referrals (Level 1)</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.7.0/ethers.umd.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #00ffcc;
            --secondary: #9d4edd;
            --bg: #0a0b10;
            --text: #ffffff;
            --border: #2d2f3e;
            --gradient: linear-gradient(90deg, #00ffcc, #9d4edd, #ff2a6d, #00ffcc);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; min-height: 100vh; }
        .rainbow-border { position: fixed; top: 0; left: 0; width: 100%; height: 4px; background: var(--gradient); background-size: 400% 400%; animation: rainbow 8s ease infinite; z-index: 1000; }
        @keyframes rainbow { 0%{background-position:0% 50%} 50%{background-position:100% 50%} 100%{background-position:0% 50%} }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .connect-btn { position: fixed; top: 20px; right: 20px; background: linear-gradient(90deg, var(--primary), var(--secondary)); color: #000; border: none; border-radius: 15px; padding: 12px 25px; font-weight: 800; font-size: 14px; cursor: pointer; z-index: 1001; display: flex; align-items: center; gap: 10px; }
        .connect-btn.connected { background: rgba(0,255,204,0.1); color: var(--primary); border: 1px solid var(--primary); }
        .header { text-align: center; margin: 40px 0 30px; }
        .header h1 { background: var(--gradient); -webkit-background-clip: text; background-clip: text; color: transparent; font-size: 36px; font-weight: 800; }
        .header p { color: #aaa; margin-top: 8px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: rgba(22,24,33,0.8); border-radius: 16px; padding: 20px; border: 1px solid rgba(0,255,204,0.15); }
        .stat-title { color: #aaa; font-size: 13px; margin-bottom: 10px; display: flex; align-items: center; gap: 8px; }
        .stat-title i { color: var(--primary); }
        .stat-value { font-size: 28px; font-weight: 800; color: var(--primary); }
        .stat-sub { font-size: 13px; color: #888; margin-top: 4px; }
        .main-card { background: rgba(22,24,33,0.8); border-radius: 20px; padding: 22px; border: 1px solid rgba(0,255,204,0.15); }
        .card-title { color: var(--primary); font-size: 20px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 10px; }
        .table-responsive { overflow-x: auto; border-radius: 12px; }
        table { width: 100%; border-collapse: collapse; min-width: 700px; }
        th { padding: 14px 12px; text-align: left; font-size: 13px; color: var(--primary); text-transform: uppercase; border-bottom: 2px solid rgba(0,255,204,0.2); }
        td { padding: 13px 12px; border-bottom: 1px solid rgba(45,47,62,0.4); font-size: 13px; }
        tr:hover td { background: rgba(255,255,255,0.03); }
        .wallet-address { font-family: monospace; background: rgba(255,255,255,0.05); padding: 5px 10px; border-radius: 6px; font-size: 12px; }
        .level-badge { padding: 4px 10px; border-radius: 12px; font-size: 11px; font-weight: 700; }
        .active { background: rgba(0,255,204,0.15); color: #00ffcc; }
        .inactive { background: rgba(255,170,0,0.15); color: #ffaa00; }
        .loading, .empty { text-align: center; padding: 50px 20px; color: var(--primary); }
        .progress-box { background: rgba(0,255,204,0.1); border-radius: 12px; padding: 16px; max-width: 400px; margin: 15px auto; border: 1px solid rgba(0,255,204,0.25); }
        .progress-bar { height: 8px; background: linear-gradient(90deg, var(--primary), var(--secondary)); border-radius: 4px; width: 0%; transition: width 0.3s; }
        .progress-text { color: #bbb; font-size: 13px; margin-top: 10px; text-align: center; }
        .nav { margin-bottom: 20px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; color: var(--primary); text-decoration: none; font-weight: 600; padding: 10px 16px; border-radius: 12px; background: rgba(0,255,204,0.1); border: 1px solid rgba(0,255,204,0.3); }
        @media (max-width: 600px) {
            .connect-btn { position: relative; top: auto; right: auto; width: 100%; justify-content: center; margin-bottom: 15px; }
            .header h1 { font-size: 26px; }
            .stat-value { font-size: 22px; }
        }
    </style>
</head>
<body>
    <div class="rainbow-border"></div>

    <button class="connect-btn" id="connectBtn" onclick="connectWallet()">
        <i class="fas fa-wallet"></i> <span id="btn-text">Connect Wallet</span>
    </button>

    <div class="container">
        <div class="nav">
            <a href="index.html" class="back-btn"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
        </div>

        <div class="header">
            <h1>DIRECT REFERRALS</h1>
            <p>Level 1 Only • Fast Loading</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-title"><i class="fas fa-users"></i> Total Directs</div>
                <div class="stat-value" id="total-directs">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i class="fas fa-crown"></i> Active (≥10 USDT)</div>
                <div class="stat-value" id="active-directs">0</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i class="fas fa-coins"></i> Team Holdings</div>
                <div class="stat-value" id="team-sigma">0</div>
                <div class="stat-sub" id="team-usdt">$0.00</div>
            </div>
            <div class="stat-card">
                <div class="stat-title"><i class="fas fa-chart-line"></i> Buy Rate</div>
                <div class="stat-value" id="buy-rate">0.0000</div>
            </div>
        </div>

        <div class="main-card">
            <div class="card-title"><i class="fas fa-sitemap"></i> Your Level 1 Members</div>
            
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Wallet</th>
                            <th>SIG6 Balance</th>
                            <th>USDT Value</th>
                            <th>Join Date</th>
                            <th>Directs</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody id="team-body">
                        <tr><td colspan="7" class="loading"><i class="fas fa-wallet"></i><br>Connect wallet to view directs</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        const SIGMA_ADDR = "0xaF215838d156F7d348A6d56cA962cbC680A2153F";
        const PUBLIC_RPCS = [
            "https://polygon.drpc.org",
            "https://polygon.publicnode.com",
            "https://1rpc.io/matic"
        ];

        const ABI = [
            "function getCurrentBuyRate() view returns (uint256)",
            "function balanceOf(address) view returns (uint256)",
            "function users(address) view returns (address upline, uint256 directCount, uint256 lastBuyTimestamp, uint256, uint256, uint256, bool)",
            "event Buy(address indexed user, uint256 amount, uint256 rate, uint256 usdtSpent)"
        ];

        let provider, readProvider, userAddress, readContract;
        let directs = [];
        let buyRate = 0.43, sellRate = 0.39;

        const CHUNK = 2500;
        const DAYS = 45;                    // ~45 days
        const BLOCKS = DAYS * 24 * 60 * 30; // approx blocks

        function showLoading(msg) {
            document.getElementById('team-body').innerHTML = `
                <tr><td colspan="7" class="loading">
                    <i class="fas fa-spinner fa-spin" style="font-size:26px"></i><br>
                    <div class="progress-box">
                        <div class="progress-bar" id="bar" style="width:0%"></div>
                        <div class="progress-text" id="txt">${msg}</div>
                    </div>
                </td></tr>`;
        }

        function progress(p, text) {
            const bar = document.getElementById('bar');
            const txt = document.getElementById('txt');
            if (bar) bar.style.width = Math.min(p, 100) + '%';
            if (txt) txt.innerHTML = text;
        }

        async function getRPC() {
            for (const url of PUBLIC_RPCS) {
                try {
                    const p = new ethers.JsonRpcProvider(url, 137);
                    await p.getBlockNumber();
                    return p;
                } catch {}
            }
            return new ethers.BrowserProvider(window.ethereum);
        }

        async function connectWallet() {
            if (!window.ethereum) return alert("Install MetaMask");
            try {
                provider = new ethers.BrowserProvider(window.ethereum);
                const net = await provider.getNetwork();
                if (net.chainId !== 137n) {
                    await window.ethereum.request({ method: 'wallet_switchEthereumChain', params: [{ chainId: '0x89' }] });
                }
                const accounts = await provider.send("eth_requestAccounts", []);
                userAddress = accounts[0].toLowerCase();
                
                readProvider = await getRPC();
                readContract = new ethers.Contract(SIGMA_ADDR, ABI, readProvider);

                document.getElementById('btn-text').textContent = userAddress.slice(0,6) + '...' + userAddress.slice(-4);
                document.getElementById('connectBtn').classList.add('connected');

                await loadDirects();
            } catch (e) {
                alert("Connection failed");
                console.error(e);
            }
        }

        async function loadDirects() {
            showLoading("Scanning for your direct referrals...<br>Please wait 1-3 minutes");

            try {
                const current = await readProvider.getBlockNumber();
                const from = Math.max(current - BLOCKS, 0);

                // Get rate
                try {
                    const rateBN = await readContract.getCurrentBuyRate();
                    buyRate = parseFloat(ethers.formatUnits(rateBN, 6));
                    sellRate = buyRate * 0.91;
                } catch {}
                document.getElementById('buy-rate').textContent = buyRate.toFixed(4);

                // Scan Buy events
                let allBuyers = new Set();
                let fromBlock = from;

                while (fromBlock <= current) {
                    const toBlock = Math.min(fromBlock + CHUNK - 1, current);
                    try {
                        const events = await readContract.queryFilter(readContract.filters.Buy(), fromBlock, toBlock);
                        events.forEach(e => {
                            if (e.args?.user) allBuyers.add(e.args.user.toLowerCase());
                        });
                    } catch (err) {
                        console.warn("chunk error", fromBlock, toBlock);
                        await new Promise(r => setTimeout(r, 800));
                    }

                    const pct = ((fromBlock - from) / (current - from)) * 80;
                    progress(pct, `Scanning...<br>Block ${fromBlock.toLocaleString()} → ${toBlock.toLocaleString()}<br>Found ${allBuyers.size} buyers`);
                    fromBlock = toBlock + 1;
                    await new Promise(r => setTimeout(r, 180));
                }

                progress(85, `Checking ${allBuyers.size} addresses for your directs...`);

                // Check who has you as upline
                const addresses = Array.from(allBuyers);
                directs = [];
                const batch = 20;

                for (let i = 0; i < addresses.length; i += batch) {
                    const slice = addresses.slice(i, i + batch);
                    await Promise.all(slice.map(async (addr) => {
                        try {
                            const u = await readContract.users(addr);
                            if (u.upline && u.upline.toLowerCase() === userAddress) {
                                const balBN = await readContract.balanceOf(addr);
                                const balance = parseFloat(ethers.formatEther(balBN));
                                directs.push({
                                    address: addr,
                                    balance,
                                    usdtValue: balance * sellRate,
                                    isActive: (balance * sellRate) >= 10,
                                    directCount: Number(u.directCount || 0),
                                    lastBuy: Number(u.lastBuyTimestamp || 0)
                                });
                            }
                        } catch {}
                    }));
                    progress(85 + (i / addresses.length) * 14, `Checking directs... ${i}/${addresses.length}`);
                    await new Promise(r => setTimeout(r, 100));
                }

                // Sort by balance high to low
                directs.sort((a, b) => b.balance - a.balance);

                updateUI();
            } catch (e) {
                console.error(e);
                document.getElementById('team-body').innerHTML = `<tr><td colspan="7" class="empty"><i class="fas fa-exclamation-triangle"></i><br>Error loading data</td></tr>`;
            }
        }

        function updateUI() {
            const total = directs.length;
            const active = directs.filter(d => d.isActive).length;
            const totalSigma = directs.reduce((s, d) => s + d.balance, 0);
            const totalUsdt = directs.reduce((s, d) => s + d.usdtValue, 0);

            document.getElementById('total-directs').textContent = total;
            document.getElementById('active-directs').textContent = active;
            document.getElementById('team-sigma').textContent = totalSigma.toFixed(2);
            document.getElementById('team-usdt').textContent = '$' + totalUsdt.toFixed(2);

            const tbody = document.getElementById('team-body');
            if (total === 0) {
                tbody.innerHTML = `<tr><td colspan="7" class="empty"><i class="fas fa-users-slash"></i><br>No direct referrals found<br><small style="color:#888">in last ~45 days</small></td></tr>`;
                return;
            }

            let html = '';
            directs.forEach((d, i) => {
                const date = d.lastBuy > 0 ? new Date(d.lastBuy * 1000).toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) : '—';
                html += `<tr>
                    <td>${i+1}</td>
                    <td>
                        <span class="wallet-address">${d.address.slice(0,8)}...${d.address.slice(-6)}</span>
                        <div style="margin-top:4px;font-size:11px">
                            <i class="fas fa-copy" style="cursor:pointer;margin-right:8px" onclick="navigator.clipboard.writeText('${d.address}')"></i>
                            <i class="fas fa-external-link-alt" style="cursor:pointer" onclick="window.open('https://polygonscan.com/address/${d.address}')"></i>
                        </div>
                    </td>
                    <td style="color:var(--primary);font-weight:700">${d.balance.toFixed(2)}</td>
                    <td>$${d.usdtValue.toFixed(2)}</td>
                    <td>${date}</td>
                    <td>${d.directCount}</td>
                    <td><span class="level-badge ${d.isActive ? 'active' : 'inactive'}">${d.isActive ? 'Active' : 'Inactive'}</span></td>
                </tr>`;
            });
            tbody.innerHTML = html;
        }

        // Auto connect if already connected
        window.onload = async () => {
            if (window.ethereum) {
                const accounts = await window.ethereum.request({ method: 'eth_accounts' });
                if (accounts.length) connectWallet();
            }
        };
    </script>
</body>
</html>
