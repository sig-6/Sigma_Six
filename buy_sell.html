<script>
const SIGMA_ADDR = "0xaF215838d156F7d348A6d56cA962cbC680A2153F";
const START_BLOCK = 85000998;
const CHUNK_SIZE = 2000;
const MIN_CHUNK_SIZE = 100;
const MAX_RETRIES = 4;

const SIGMA_ABI = [
    "function getCurrentBuyRate() view returns (uint256)",
    "function balanceOf(address) view returns (uint256)",
    "event Buy(address indexed user, uint256 amount, uint256 rate, uint256 usdtSpent)",
    "event Sell(address indexed user, uint256 amount, uint256 rate, uint256 usdtReceived)"
];

let provider, signer, userAddress, sigmaContract;
let buyTransactions = [];
let sellTransactions = [];
let currentBuyRate = 0;
let isLoading = false;
let currentTab = "active";

async function connectWallet() {
    if (!window.ethereum) {
        alert("Please install MetaMask!");
        return;
    }

    try {
        provider = new ethers.BrowserProvider(window.ethereum);

        let network = await provider.getNetwork();

        if (network.chainId !== 137n) {
            try {
                await window.ethereum.request({
                    method: "wallet_switchEthereumChain",
                    params: [{ chainId: "0x89" }]
                });

                // Network switch ke baad provider dobara initialize karein
                provider = new ethers.BrowserProvider(window.ethereum);
                network = await provider.getNetwork();

            } catch (error) {
                alert("Please switch MetaMask to Polygon Mainnet.");
                return;
            }
        }

        if (network.chainId !== 137n) {
            alert("Polygon Mainnet select nahi hai.");
            return;
        }

        const accounts = await provider.send("eth_requestAccounts", []);

        if (!accounts || !accounts.length) {
            alert("Wallet account nahi mila.");
            return;
        }

        userAddress = accounts[0].toLowerCase();
        signer = await provider.getSigner();

        sigmaContract = new ethers.Contract(
            SIGMA_ADDR,
            SIGMA_ABI,
            provider
        );

        updateWalletButton();
        await loadData();

    } catch (error) {
        console.error("Wallet connection error:", error);
        alert("Connection failed: " + error.message);
    }
}

function updateWalletButton() {
    if (!userAddress) return;

    document.getElementById("btn-text").textContent =
        userAddress.slice(0, 6) + "..." + userAddress.slice(-4);

    document.getElementById("connectBtn").classList.add("connected");
}

function updateProgress(percent, startedAt, message = "") {
    const bar = document.getElementById("progress-bar");
    const text = document.getElementById("progress-text");

    if (!bar || !text) return;

    percent = Math.max(0, Math.min(100, percent));
    bar.style.width = percent.toFixed(1) + "%";

    let remainingText = "";

    if (percent > 0 && percent < 100 && startedAt) {
        const elapsed = (Date.now() - startedAt) / 1000;
        const totalEstimated = elapsed / (percent / 100);
        const remaining = Math.max(0, totalEstimated - elapsed);

        remainingText = " | Approx. remaining: " +
            formatTime(remaining);
    }

    text.textContent =
        (message || "Loading events") +
        ": " + percent.toFixed(1) + "%" +
        remainingText;
}

function formatTime(seconds) {
    if (!Number.isFinite(seconds)) return "Calculating...";

    seconds = Math.ceil(seconds);

    if (seconds < 60) return seconds + " sec";

    const minutes = Math.floor(seconds / 60);
    const secs = seconds % 60;

    if (minutes < 60) {
        return minutes + " min " + secs + " sec";
    }

    const hours = Math.floor(minutes / 60);
    return hours + " hr " + (minutes % 60) + " min";
}

// Ek block range ko retry ke saath fetch karega.
// Error par chunk size chhota karega; same range par infinite loop nahi hoga.
async function fetchChunkWithRetry(contract, filter, fromBlock, toBlock) {
    let lastError;

    for (let attempt = 1; attempt <= MAX_RETRIES; attempt++) {
        try {
            return await contract.queryFilter(
                filter,
                fromBlock,
                toBlock
            );

        } catch (error) {
            lastError = error;

            const rangeSize = toBlock - fromBlock + 1;

            console.warn(
                "Chunk error:",
                fromBlock,
                toBlock,
                "Attempt:",
                attempt,
                error
            );

            if (rangeSize <= MIN_CHUNK_SIZE || attempt === MAX_RETRIES) {
                break;
            }

            await new Promise(resolve =>
                setTimeout(resolve, 500 * attempt)
            );
        }
    }

    throw new Error(
        "Block " + fromBlock + "-" + toBlock +
        " scan nahi ho paya. RPC error: " +
        (lastError?.message || "Unknown error")
    );
}

async function fetchEventsInChunks(
    contract,
    eventFilter,
    fromBlock,
    toBlock,
    progressCallback
) {
    const allEvents = [];
    let currentFrom = fromBlock;
    let chunkSize = CHUNK_SIZE;

    const totalBlocks = Math.max(1, toBlock - fromBlock + 1);

    while (currentFrom <= toBlock) {
        let currentTo = Math.min(
            currentFrom + chunkSize - 1,
            toBlock
        );

        try {
            const events = await fetchChunkWithRetry(
                contract,
                eventFilter,
                currentFrom,
                currentTo
            );

            allEvents.push(...events);

            currentFrom = currentTo + 1;

        } catch (error) {
            // Bade chunk ko chhota karke dobara try karein.
            if (chunkSize > MIN_CHUNK_SIZE) {
                chunkSize = Math.max(
                    MIN_CHUNK_SIZE,
                    Math.floor(chunkSize / 2)
                );

                console.warn(
                    "Chunk size reduced to:",
                    chunkSize
                );

                continue;
            }

            // Data silently skip nahi hoga; clear error show hoga.
            throw error;
        }

        const completed = currentFrom - fromBlock;
        const percent = (completed / totalBlocks) * 100;

        if (progressCallback) {
            progressCallback(percent);
        }

        // RPC rate limiting se bachne ke liye chhota delay
        await new Promise(resolve => setTimeout(resolve, 100));
    }

    return allEvents;
}

// Unique block numbers ke timestamps batches mein fetch karein.
async function addBlockTimestamps(events) {
    const uniqueBlocks = [
        ...new Set(events.map(event => event.blockNumber))
    ];

    const timestampMap = new Map();
    const BATCH_SIZE = 30;

    for (let i = 0; i < uniqueBlocks.length; i += BATCH_SIZE) {
        const batch = uniqueBlocks.slice(i, i + BATCH_SIZE);

        const blocks = await Promise.all(
            batch.map(async blockNumber => {
                try {
                    return await provider.getBlock(blockNumber);
                } catch (error) {
                    console.warn(
                        "Block timestamp error:",
                        blockNumber,
                        error
                    );
                    return null;
                }
            })
        );

        blocks.forEach((block, index) => {
            timestampMap.set(
                batch[index],
                block ? Number(block.timestamp) : 0
            );
        });
    }

    return timestampMap;
}

function processEvents(events, type, timestampMap) {
    return events.map(event => {
        const args = event.args;
        const timestamp = timestampMap.get(event.blockNumber) || 0;

        const amount = Number(
            ethers.formatUnits(args.amount, 18)
        );

        const rate = Number(
            ethers.formatUnits(args.rate, 6)
        );

        const usdtAmount = type === "buy"
            ? Number(ethers.formatUnits(args.usdtSpent, 6))
            : Number(ethers.formatUnits(args.usdtReceived, 6));

        return {
            hash: event.transactionHash,
            sigmaAmount: amount,
            usdtAmount: usdtAmount,
            rate: rate,
            timestamp: timestamp,
            date: timestamp
                ? new Date(timestamp * 1000)
                : new Date(0),
            blockNumber: event.blockNumber
        };
    });
}

async function loadData() {
    if (!userAddress || !sigmaContract || !provider) {
        document.getElementById("active-body").innerHTML =
            '<tr><td colspan="7" class="empty-state">' +
            '<i class="fas fa-wallet"></i><br>' +
            'Please connect wallet to view data</td></tr>';

        document.getElementById("closed-body").innerHTML =
            '<tr><td colspan="8" class="empty-state">' +
            '<i class="fas fa-wallet"></i><br>' +
            'Please connect wallet to view data</td></tr>';

        return;
    }

    if (isLoading) return;

    isLoading = true;
    const startedAt = Date.now();

    try {
        document.getElementById("active-body").innerHTML = `
            <tr>
                <td colspan="7" class="loading">
                    <i class="fas fa-spinner fa-spin"></i><br>
                    <div class="progress-container">
                        <div class="progress-bar" id="progress-bar"></div>
                        <div class="progress-text" id="progress-text">
                            Preparing scan...
                        </div>
                    </div>
                </td>
            </tr>`;

        document.getElementById("closed-body").innerHTML = `
            <tr>
                <td colspan="8" class="loading">
                    <i class="fas fa-spinner fa-spin"></i><br>
                    Loading sell history...
                </td>
            </tr>`;

        // Current Sigma buy rate
        try {
            const rateBN = await sigmaContract.getCurrentBuyRate();
            currentBuyRate = Number(
                ethers.formatUnits(rateBN, 6)
            );
        } catch (error) {
            console.error("Rate fetch error:", error);
            currentBuyRate = 0;
        }

        const currentBlock = await provider.getBlockNumber();

        if (currentBlock < START_BLOCK) {
            throw new Error(
                "Current Polygon block START_BLOCK se kam hai."
            );
        }

        const fromBlock = START_BLOCK;
        const toBlock = currentBlock;

        console.log(
            "Scanning Sigma contract events:",
            fromBlock,
            "to",
            toBlock
        );

        const totalBlocks = toBlock - fromBlock + 1;

        // Buy aur Sell dono ke liye progress alag track hoga.
        let buyProgress = 0;
        let sellProgress = 0;

        function showCombinedProgress() {
            const combined = (buyProgress + sellProgress) / 2;

            updateProgress(
                combined,
                startedAt,
                "Buy/Sell history"
            );
        }

        // Sirf connected wallet ke events.
        // queryFilter Sigma contract address par hi logs search karta hai.
        const buyFilter = sigmaContract.filters.Buy(userAddress);
        const sellFilter = sigmaContract.filters.Sell(userAddress);

        const [buyEvents, sellEvents] = await Promise.all([
            fetchEventsInChunks(
                sigmaContract,
                buyFilter,
                fromBlock,
                toBlock,
                percent => {
                    buyProgress = percent;
                    showCombinedProgress();
                }
            ),

            fetchEventsInChunks(
                sigmaContract,
                sellFilter,
                fromBlock,
                toBlock,
                percent => {
                    sellProgress = percent;
                    showCombinedProgress();
                }
            )
        ]);

        console.log(
            "Buy events:",
            buyEvents.length,
            "Sell events:",
            sellEvents.length
        );

        updateProgress(95, startedAt, "Processing transactions");

        // Dono event lists ke unique block timestamps ek saath fetch karein.
        const allEvents = [...buyEvents, ...sellEvents];
        const timestampMap = await addBlockTimestamps(allEvents);

        buyTransactions = processEvents(
            buyEvents,
            "buy",
            timestampMap
        );

        sellTransactions = processEvents(
            sellEvents,
            "sell",
            timestampMap
        );

        buyTransactions.sort(
            (a, b) => b.timestamp - a.timestamp
        );

        sellTransactions.sort(
            (a, b) => b.timestamp - a.timestamp
        );

        console.log(
            "History loaded:",
            buyTransactions.length,
            "buys,",
            sellTransactions.length,
            "sells"
        );

        updateStats();
        updateTables();

        updateProgress(100, startedAt, "Completed");

    } catch (error) {
        console.error("Error loading data:", error);

        const safeMessage = String(error.message || error)
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;");

        document.getElementById("active-body").innerHTML =
            '<tr><td colspan="7" class="empty-state">' +
            '<i class="fas fa-exclamation-circle"></i><br>' +
            'Error: ' + safeMessage +
            '</td></tr>';

        document.getElementById("closed-body").innerHTML =
            '<tr><td colspan="8" class="empty-state">' +
            '<i class="fas fa-exclamation-circle"></i><br>' +
            'Error: ' + safeMessage +
            '</td></tr>';

    } finally {
        isLoading = false;
    }
}

function getAverageBuyRateForSell(sellAmount, sellTimestamp) {
    const buysBefore = buyTransactions
        .filter(b => b.timestamp < sellTimestamp)
        .sort((a, b) => a.timestamp - b.timestamp);

    if (buysBefore.length === 0) return currentBuyRate;

    let remaining = sellAmount;
    let totalCost = 0;
    let totalQty = 0;

    for (const buy of buysBefore) {
        if (remaining <= 0) break;

        const qty = Math.min(buy.sigmaAmount, remaining);

        totalCost += qty * buy.rate;
        totalQty += qty;
        remaining -= qty;
    }

    return totalQty > 0
        ? totalCost / totalQty
        : currentBuyRate;
}

function updateStats() {
    let totalBought = 0;
    let totalBoughtValue = 0;
    let totalSold = 0;
    let totalSoldValue = 0;

    buyTransactions.forEach(tx => {
        totalBought += tx.sigmaAmount;
        totalBoughtValue += tx.usdtAmount;
    });

    sellTransactions.forEach(tx => {
        totalSold += tx.sigmaAmount;
        totalSoldValue += tx.usdtAmount;
    });

    const currentHoldings = totalBought - totalSold;
    const holdingsValue = currentHoldings * currentBuyRate;

    const avgBuyRate = totalBought > 0
        ? totalBoughtValue / totalBought
        : 0;

    const remainingCost = currentHoldings * avgBuyRate;
    const netPL = holdingsValue - remainingCost;

    const plPercentage = remainingCost > 0
        ? (netPL / remainingCost) * 100
        : 0;

    document.getElementById("total-bought").textContent =
        totalBought.toFixed(2) + " SIG6";

    document.getElementById("total-bought-value").textContent =
        "$" + totalBoughtValue.toFixed(2);

    document.getElementById("total-sold").textContent =
        totalSold.toFixed(2) + " SIG6";

    document.getElementById("total-sold-value").textContent =
        "$" + totalSoldValue.toFixed(2);

    document.getElementById("current-holdings").textContent =
        currentHoldings.toFixed(2) + " SIG6";

    document.getElementById("holdings-value").textContent =
        "$" + holdingsValue.toFixed(2);

    document.getElementById("net-pnl").textContent =
        "$" + netPL.toFixed(2);

    document.getElementById("net-pnl").style.color =
        netPL >= 0 ? "var(--profit)" : "var(--loss)";

    document.getElementById("pnl-percentage").textContent =
        (netPL >= 0 ? "+" : "") + plPercentage.toFixed(2) + "%";
}

function updateTables() {
    updateActiveTable();
    updateClosedTable();
}

function updateActiveTable() {
    const tbody = document.getElementById("active-body");

    if (buyTransactions.length === 0) {
        tbody.innerHTML =
            '<tr><td colspan="7" class="empty-state">' +
            '<i class="fas fa-chart-bar"></i><br>' +
            'No buy history found</td></tr>';
        return;
    }

    let html = "";

    buyTransactions.forEach((tx, i) => {
        const currentValue = tx.sigmaAmount * currentBuyRate;
        const buyValue = tx.sigmaAmount * tx.rate;

        const pl = buyValue > 0
            ? ((currentValue - buyValue) / buyValue * 100)
            : 0;

        const dateStr = tx.date.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });

        const timeStr = tx.date.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        });

        html += `
            <tr>
                <td>${i + 1}</td>
                <td>
                    <div style="font-weight:600">${dateStr}</div>
                    <div style="font-size:12px;color:#888">${timeStr}</div>
                </td>
                <td style="font-weight:700;color:var(--primary)">
                    ${tx.sigmaAmount.toFixed(4)} SIG6
                </td>
                <td>$${tx.rate.toFixed(4)}</td>
                <td>$${currentBuyRate.toFixed(4)}</td>
                <td>
                    <div class="${pl >= 0 ? "badge-profit" : "badge-loss"}"
                         style="display:inline-block">
                        ${pl >= 0 ? "+" : ""}${pl.toFixed(2)}%
                    </div>
                </td>
                <td><span class="badge badge-active">BUY</span></td>
            </tr>`;
    });

    tbody.innerHTML = html;
}

function updateClosedTable() {
    const tbody = document.getElementById("closed-body");

    if (sellTransactions.length === 0) {
        tbody.innerHTML =
            '<tr><td colspan="8" class="empty-state">' +
            '<i class="fas fa-history"></i><br>' +
            'No sell history found</td></tr>';
        return;
    }

    let html = "";

    sellTransactions.forEach((tx, i) => {
        const avgBuyRate = getAverageBuyRateForSell(
            tx.sigmaAmount,
            tx.timestamp
        );

        const plAmount =
            (tx.rate - avgBuyRate) * tx.sigmaAmount;

        const plPercentage = avgBuyRate > 0
            ? ((tx.rate - avgBuyRate) / avgBuyRate * 100)
            : 0;

        const dateStr = tx.date.toLocaleDateString("en-GB", {
            day: "2-digit",
            month: "short",
            year: "numeric"
        });

        const timeStr = tx.date.toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: true
        });

        html += `
            <tr>
                <td>${i + 1}</td>
                <td>
                    <div style="font-weight:600">${dateStr}</div>
                    <div style="font-size:12px;color:#888">${timeStr}</div>
                </td>
                <td style="font-weight:700;color:var(--primary)">
                    ${tx.sigmaAmount.toFixed(4)} SIG6
                </td>
                <td>$${avgBuyRate.toFixed(4)}</td>
                <td>$${tx.rate.toFixed(4)}</td>
                <td>
                    <div class="${plAmount >= 0 ? "pnl-positive" : "pnl-negative"}"
                         style="padding:4px 8px;border-radius:6px;display:inline-block">
                        <i class="fas fa-${plAmount >= 0 ? "arrow-up" : "arrow-down"}"></i>
                        $${Math.abs(plAmount).toFixed(2)}
                    </div>
                </td>
                <td>
                    <div class="${plAmount >= 0 ? "badge-profit" : "badge-loss"}"
                         style="display:inline-block">
                        ${plAmount >= 0 ? "+" : ""}${plPercentage.toFixed(2)}%
                    </div>
                </td>
                <td><span class="badge badge-closed">SOLD</span></td>
            </tr>`;
    });

    tbody.innerHTML = html;
}

function showTab(tabName, event) {
    currentTab = tabName;

    document.querySelectorAll(".action-btn").forEach(btn => {
        btn.classList.remove("active");
    });

    if (event && event.target) {
        const button = event.target.closest(".action-btn");
        if (button) button.classList.add("active");
    }

    document.getElementById("active-section").style.display =
        tabName === "active" ? "block" : "none";

    document.getElementById("closed-section").style.display =
        tabName === "closed" ? "block" : "none";
}

function exportData() {
    if (!userAddress) {
        alert("Please connect wallet first");
        return;
    }

    if (buyTransactions.length === 0 && sellTransactions.length === 0) {
        alert("No data to export");
        return;
    }

    let rows = [];

    if (currentTab === "active") {
        rows.push([
            "Serial No",
            "Date",
            "Time",
            "Sigma Quantity",
            "Buy Rate (USDT)",
            "Current Rate (USDT)",
            "P&L %",
            "Status"
        ]);

        buyTransactions.forEach((tx, i) => {
            const buyValue = tx.sigmaAmount * tx.rate;
            const currentValue = tx.sigmaAmount * currentBuyRate;

            const pl = buyValue > 0
                ? ((currentValue - buyValue) / buyValue * 100)
                : 0;

            rows.push([
                i + 1,
                tx.date.toLocaleDateString(),
                tx.date.toLocaleTimeString(),
                tx.sigmaAmount.toFixed(4),
                tx.rate.toFixed(4),
                currentBuyRate.toFixed(4),
                pl.toFixed(2) + "%",
                "BUY"
            ]);
        });

    } else {
        rows.push([
            "Serial No",
            "Date",
            "Time",
            "Sigma Quantity",
            "Buy Rate (USDT)",
            "Sell Rate (USDT)",
            "P&L Amount (USDT)",
            "P&L %",
            "Status"
        ]);

        sellTransactions.forEach((tx, i) => {
            const avgBuyRate = getAverageBuyRateForSell(
                tx.sigmaAmount,
                tx.timestamp
            );

            const plAmount =
                (tx.rate - avgBuyRate) * tx.sigmaAmount;

            const plPercentage = avgBuyRate > 0
                ? ((tx.rate - avgBuyRate) / avgBuyRate * 100)
                : 0;

            rows.push([
                i + 1,
                tx.date.toLocaleDateString(),
                tx.date.toLocaleTimeString(),
                tx.sigmaAmount.toFixed(4),
                avgBuyRate.toFixed(4),
                tx.rate.toFixed(4),
                plAmount.toFixed(2),
                plPercentage.toFixed(2) + "%",
                "SOLD"
            ]);
        });
    }

    const csv = rows.map(row =>
        row.map(value =>
            '"' + String(value).replace(/"/g, '""') + '"'
        ).join(",")
    ).join("\n");

    const blob = new Blob(
        ["\uFEFF" + csv],
        { type: "text/csv;charset=utf-8;" }
    );

    const url = URL.createObjectURL(blob);
    const link = document.createElement("a");

    link.href = url;
    link.download = "sigma_" + currentTab + "_history.csv";

    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);

    URL.revokeObjectURL(url);
}

async function autoConnect() {
    if (!window.ethereum) return;

    try {
        provider = new ethers.BrowserProvider(window.ethereum);

        const network = await provider.getNetwork();

        if (network.chainId !== 137n) {
            console.log("Please select Polygon Mainnet.");
            return;
        }

        const accounts = await provider.listAccounts();

        if (!accounts.length) return;

        userAddress = accounts[0].address.toLowerCase();

        sigmaContract = new ethers.Contract(
            SIGMA_ADDR,
            SIGMA_ABI,
            provider
        );

        updateWalletButton();
        await loadData();

    } catch (error) {
        console.log("Auto-connect error:", error);
    }
}

// Wallet account ya network change hone par update
if (window.ethereum) {
    window.ethereum.on("accountsChanged", () => {
        window.location.reload();
    });

    window.ethereum.on("chainChanged", () => {
        window.location.reload();
    });
}

window.onload = function() {
    autoConnect();
};
</script>
