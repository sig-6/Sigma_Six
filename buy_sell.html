
<script>
"use strict";

/* =============== CONFIGURATION =============== */

const SIGMA_ADDR = "0xaF215838d156F7d348A6d56cA962cbC680A2153F";
const START_BLOCK = 85000998;
const CHAIN_ID = 137n;

const RPC_URLS = [
  "https://polygon-bor-rpc.publicnode.com",
  "https://polygon.drpc.org"
];

const INITIAL_CHUNK = 5000;
const MIN_CHUNK = 100;
const PARALLEL_REQUESTS = 3;
const TIMESTAMP_WORKERS = 6;

const ABI = [
  "function getCurrentBuyRate() view returns (uint256)",
  "function balanceOf(address) view returns (uint256)",
  "event Buy(address indexed user,uint256 amount,uint256 rate,uint256 usdtSpent)",
  "event Sell(address indexed user,uint256 amount,uint256 rate,uint256 usdtReceived)"
];

const iface = new ethers.Interface(ABI);
const BUY_TOPIC = iface.getEvent("Buy").topicHash;
const SELL_TOPIC = iface.getEvent("Sell").topicHash;

let rpcProviders = [];
let walletProvider = null;
let userAddress = null;
let sigmaContract = null;

let buyTransactions = [];
let sellTransactions = [];

let currentBuyRate = 0;
let currentBalance = 0;
let isLoading = false;
let currentTab = "active";

const $ = id => document.getElementById(id);

/* =============== STATUS UI =============== */

function setupProgressUI() {
  if ($("scan-progress")) return;

  const box = document.createElement("div");
  box.id = "scan-progress";
  box.className = "progress-container";
  box.style.margin = "15px 0";
  box.innerHTML = `
    <div id="scan-status" style="color:var(--primary);font-size:13px">
      Connect wallet to scan history
    </div>
    <div style="height:7px;background:#292b38;border-radius:10px;margin-top:10px;overflow:hidden">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    <div id="progress-text" class="progress-text">0%</div>
  `;

  const nav = document.querySelector(".nav-container");
  if (nav) nav.insertAdjacentElement("afterend", box);
}

function setStatus(message) {
  if ($("scan-status")) $("scan-status").textContent = message;
  console.log(message);
}

function setProgress(percent, message) {
  const p = Math.max(0, Math.min(100, percent));

  if ($("progress-bar")) {
    $("progress-bar").style.width = p + "%";
  }

  if ($("progress-text")) {
    $("progress-text").textContent = p.toFixed(1) + "%";
  }

  if (message) setStatus(message);
}

function showError(message) {
  setStatus("ERROR: " + message);
  console.error(message);
}

/* =============== RPC =============== */

function initializeRPC() {
  rpcProviders = RPC_URLS.map(url =>
    new ethers.JsonRpcProvider(
      url,
      Number(CHAIN_ID),
      { staticNetwork: true }
    )
  );
}

async function rpcCall(callback) {
  let lastError;

  for (const rpc of rpcProviders) {
    try {
      return await callback(rpc);
    } catch (error) {
      lastError = error;
      console.warn("RPC failed; trying backup:", error);
    }
  }

  throw lastError || new Error("All Polygon RPC servers failed.");
}

/* =============== CACHE =============== */

function cacheKey() {
  return "SIGMA_HISTORY_V4_" + userAddress.toLowerCase();
}

function readCache() {
  try {
    const data = JSON.parse(localStorage.getItem(cacheKey()) || "null");

    if (
      !data ||
      data.startBlock !== START_BLOCK ||
      !Array.isArray(data.buy) ||
      !Array.isArray(data.sell)
    ) return null;

    return data;
  } catch (e) {
    return null;
  }
}

function saveCache(lastBlock) {
  try {
    localStorage.setItem(cacheKey(), JSON.stringify({
      startBlock: START_BLOCK,
      lastBlock,
      buy: buyTransactions,
      sell: sellTransactions
    }));
  } catch (e) {
    console.warn("Cache save failed", e);
  }
}

/* =============== WALLET =============== */

async function connectWallet() {
  try {
    if (!window.ethereum) {
      alert("Please install MetaMask or a compatible wallet.");
      return;
    }

    await window.ethereum.request({
      method: "eth_requestAccounts"
    });

    const network = await window.ethereum.request({
      method: "eth_chainId"
    });

    if (parseInt(network, 16) !== 137) {
      await window.ethereum.request({
        method: "wallet_switchEthereumChain",
        params: [{ chainId: "0x89" }]
      });
    }

    walletProvider = new ethers.BrowserProvider(window.ethereum);

    const accounts = await walletProvider.send("eth_accounts", []);

    if (!accounts.length) throw new Error("Wallet account not found.");

    userAddress = ethers.getAddress(accounts[0]);

    initializeRPC();

    sigmaContract = new ethers.Contract(
      SIGMA_ADDR,
      ABI,
      rpcProviders[0]
    );

    $("btn-text").textContent =
      userAddress.slice(0, 6) + "..." + userAddress.slice(-4);

    $("connectBtn").classList.add("connected");

    await loadData();

  } catch (error) {
    console.error(error);
    alert("Wallet connection failed: " + (error.shortMessage || error.message));
  }
}

/* =============== EVENT FILTER =============== */

function makeFilter(fromBlock, toBlock) {
  return {
    address: SIGMA_ADDR,
    fromBlock: ethers.toQuantity(fromBlock),
    toBlock: ethers.toQuantity(toBlock),
    topics: [
      [BUY_TOPIC, SELL_TOPIC],
      ethers.zeroPadValue(userAddress, 32)
    ]
  };
}

/* =============== EVENT DECODING =============== */

function decodeLog(log) {
  try {
    const parsed = iface.parseLog({
      topics: log.topics,
      data: log.data
    });

    if (!parsed) return null;

    const isBuy = parsed.name === "Buy";

    return {
      type: isBuy ? "buy" : "sell",
      hash: log.transactionHash,
      blockNumber: Number(log.blockNumber),
      index: Number(log.index ?? log.logIndex ?? 0),

      sigmaAmount: Number(
        ethers.formatUnits(parsed.args.amount, 18)
      ),

      rate: Number(
        ethers.formatUnits(parsed.args.rate, 6)
      ),

      usdtAmount: Number(
        ethers.formatUnits(
          isBuy ? parsed.args.usdtSpent : parsed.args.usdtReceived,
          6
        )
      ),

      timestamp: 0
    };

  } catch (error) {
    console.warn("Event decode failed:", error);
    return null;
  }
}

/* =============== RPC LOG REQUEST =============== */

async function fetchRange(from, to) {
  return rpcCall(async rpc => {
    const logs = await rpc.getLogs(makeFilter(from, to));
    return logs.map(decodeLog).filter(Boolean);
  });
}

/* =============== RANGE SCAN =============== */

async function scanRange(from, to) {
  const pending = [];

  for (let start = from; start <= to; start += INITIAL_CHUNK) {
    pending.push({
      from: start,
      to: Math.min(start + INITIAL_CHUNK - 1, to)
    });
  }

  const totalBlocks = Math.max(1, to - from + 1);
  let completedBlocks = 0;
  let allEvents = [];

  while (pending.length) {
    const batch = pending.splice(0, PARALLEL_REQUESTS);

    const results = await Promise.all(
      batch.map(async range => {
        try {
          return {
            ok: true,
            range,
            events: await fetchRange(range.from, range.to)
          };
        } catch (error) {
          return {
            ok: false,
            range,
            error
          };
        }
      })
    );

    for (const result of results) {
      const r = result.range;
      const size = r.to - r.from + 1;

      if (result.ok) {
        allEvents.push(...result.events);
        completedBlocks += size;
      } else {
        if (size <= MIN_CHUNK) {
          throw new Error(
            "RPC failed near block " + r.from +
            ". Refresh karke dobara try karein."
          );
        }

        const mid = Math.floor((r.from + r.to) / 2);

        pending.push(
          { from: r.from, to: mid },
          { from: mid + 1, to: r.to }
        );
      }
    }

    const percent = completedBlocks / totalBlocks * 90;

    setProgress(
      percent,
      "Scanning contract history: " +
      completedBlocks.toLocaleString() + " / " +
      totalBlocks.toLocaleString() + " blocks"
    );
  }

  return allEvents;
}

/* =============== TIMESTAMPS =============== */

async function addTimestamps(events) {
  const blocks = [...new Set(events.map(x => x.blockNumber))];
  const timestamps = new Map();
  let next = 0;

  const workers = Array.from(
    { length: TIMESTAMP_WORKERS },
    async () => {
      while (next < blocks.length) {
        const blockNo = blocks[next++];

        try {
          const block = await rpcCall(rpc => rpc.getBlock(blockNo));

          timestamps.set(
            blockNo,
            block ? Number(block.timestamp) : 0
          );
        } catch (e) {
          timestamps.set(blockNo, 0);
        }
      }
    }
  );

  await Promise.all(workers);

  events.forEach(event => {
    event.timestamp = timestamps.get(event.blockNumber) || 0;
  });
}

/* =============== DEDUPLICATION =============== */

function uniqueEvents(events) {
  const map = new Map();

  for (const event of events) {
    const key = event.hash.toLowerCase() + "_" + event.index;
    map.set(key, event);
  }

  return [...map.values()];
}

/* =============== LOAD HISTORY =============== */

async function loadData() {
  if (!userAddress || !rpcProviders.length) {
    alert("Please connect wallet first.");
    return;
  }

  if (isLoading) return;

  isLoading = true;

  try {
    showMessage("active-body", 7, "Loading Buy History...");
    showMessage("closed-body", 8, "Loading Sell History...");

    setProgress(0, "Connecting to Polygon RPC...");

    const walletNetwork = await walletProvider.getNetwork();

    if (walletNetwork.chainId !== CHAIN_ID) {
      throw new Error("Please switch wallet to Polygon Mainnet.");
    }

    const latestBlock = await rpcCall(
      rpc => rpc.getBlockNumber()
    );

    if (latestBlock < START_BLOCK) {
      throw new Error("START_BLOCK is greater than latest Polygon block.");
    }

    // Read current rate and real token balance
    const [rateRaw, balanceRaw] = await rpcCall(async rpc => {
      const c = new ethers.Contract(SIGMA_ADDR, ABI, rpc);

      return Promise.all([
        c.getCurrentBuyRate(),
        c.balanceOf(userAddress)
      ]);
    });

    currentBuyRate = Number(ethers.formatUnits(rateRaw, 6));
    currentBalance = Number(ethers.formatUnits(balanceRaw, 18));

    const cache = readCache();

    buyTransactions = cache ? cache.buy : [];
    sellTransactions = cache ? cache.sell : [];

    // Re-scan last 20 blocks to avoid missing late indexed events.
    const scanFrom = cache
      ? Math.max(START_BLOCK, Number(cache.lastBlock) - 19)
      : START_BLOCK;

    let newEvents = [];

    if (scanFrom <= latestBlock) {
      $("scan-progress").style.display = "block";

      newEvents = await scanRange(scanFrom, latestBlock);

      await addTimestamps(newEvents);

      buyTransactions.push(
        ...newEvents.filter(x => x.type === "buy")
      );

      sellTransactions.push(
        ...newEvents.filter(x => x.type === "sell")
      );
    }

    buyTransactions = uniqueEvents(buyTransactions);
    sellTransactions = uniqueEvents(sellTransactions);

    buyTransactions.sort(
      (a, b) => a.blockNumber - b.blockNumber || a.index - b.index
    );

    sellTransactions.sort(
      (a, b) => a.blockNumber - b.blockNumber || a.index - b.index
    );

    saveCache(latestBlock);

    updateStats();
    updateTables();

    setProgress(100, "History scan completed successfully.");

    $("scan-detail") &&
      ($("scan-detail").textContent = "Latest Block: " + latestBlock);

  } catch (error) {
    console.error("History error:", error);

    showError(error.shortMessage || error.message);

    showMessage("active-body", 7, error.message, true);
    showMessage("closed-body", 8, error.message, true);

  } finally {
    isLoading = false;
  }
}

/* =============== TABLE MESSAGE =============== */

function showMessage(id, columns, message, error = false) {
  const body = $(id);
  if (!body) return;

  body.innerHTML = "";

  const tr = document.createElement("tr");
  const td = document.createElement("td");

  td.colSpan = columns;
  td.className = error ? "empty-state" : "loading";
  td.textContent = message;

  tr.appendChild(td);
  body.appendChild(tr);
}

/* =============== STATISTICS =============== */

function updateStats() {
  const totalBought = buyTransactions.reduce(
    (s, x) => s + x.sigmaAmount, 0
  );

  const totalBuyValue = buyTransactions.reduce(
    (s, x) => s + x.usdtAmount, 0
  );

  const totalSold = sellTransactions.reduce(
    (s, x) => s + x.sigmaAmount, 0
  );

  const totalSellValue = sellTransactions.reduce(
    (s, x) => s + x.usdtAmount, 0
  );

  const holdingsValue = currentBalance * currentBuyRate;

  // This is an indicative unrealized P&L, not realized trading profit.
  const averageBuyRate = totalBought > 0
    ? totalBuyValue / totalBought
    : 0;

  const netPL = currentBalance * (currentBuyRate - averageBuyRate);
  const plPercent = averageBuyRate > 0
    ? ((currentBuyRate - averageBuyRate) / averageBuyRate) * 100
    : 0;

  $("total-bought").textContent = totalBought.toFixed(2) + " SIG6";
  $("total-bought-value").textContent = "$" + totalBuyValue.toFixed(2);

  $("total-sold").textContent = totalSold.toFixed(2) + " SIG6";
  $("total-sold-value").textContent = "$" + totalSellValue.toFixed(2);

  $("current-holdings").textContent = currentBalance.toFixed(4) + " SIG6";
  $("holdings-value").textContent = "$" + holdingsValue.toFixed(2);

  $("net-pnl").textContent = "$" + netPL.toFixed(2);
  $("net-pnl").style.color =
    netPL >= 0 ? "var(--profit)" : "var(--loss)";

  $("pnl-percentage").textContent =
    (plPercent >= 0 ? "+" : "") + plPercent.toFixed(2) + "%";

  $("pnl-percentage").title =
    "Indicative unrealized P&L based on average historical Buy value.";
}

/* =============== DATE / LINKS =============== */

function getDate(timestamp) {
  if (!timestamp) return new Date(0);

  return new Date(timestamp * 1000);
}

function txLink(hash) {
  return `<a href="https://polygonscan.com/tx/${hash}" target="_blank" rel="noopener" style="color:var(--primary)">View Tx ↗</a>`;
}

/* =============== BUY TABLE =============== */

function updateActiveTable() {
  const tbody = $("active-body");

  if (!buyTransactions.length) {
    showMessage("active-body", 7, "No Buy events found for this wallet.");
    return;
  }

  tbody.innerHTML = "";

  [...buyTransactions].reverse().forEach((tx, i) => {
    const date = getDate(tx.timestamp);

    const buyValue = tx.sigmaAmount * tx.rate;
    const currentValue = tx.sigmaAmount * currentBuyRate;

    const pl = buyValue > 0
      ? ((currentValue - buyValue) / buyValue) * 100
      : 0;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>
        ${tx.timestamp ? date.toLocaleDateString("en-GB") : "Date unavailable"}
        <div style="font-size:12px;color:#888">
          ${tx.timestamp ? date.toLocaleTimeString() : ""}
        </div>
      </td>
      <td style="color:var(--primary);font-weight:700">
        ${tx.sigmaAmount.toFixed(4)} SIG6
      </td>
      <td>$${tx.rate.toFixed(6)}</td>
      <td>$${currentBuyRate.toFixed(6)}</td>
      <td>
        <span class="${pl >= 0 ? "badge-profit" : "badge-loss"}">
          ${pl >= 0 ? "+" : ""}${pl.toFixed(2)}%
        </span>
      </td>
      <td><span class="badge badge-active">BUY</span></td>
    `;

    const txCell = document.createElement("td");
    txCell.innerHTML = txLink(tx.hash);
    tr.appendChild(txCell);

    tbody.appendChild(tr);
  });
}

/* =============== SELL TABLE =============== */

function getAverageBuyRateForSell(amount, timestamp) {
  const buysBefore = buyTransactions.filter(
    x => x.timestamp <= timestamp
  );

  if (!buysBefore.length) return 0;

  let remaining = amount;
  let cost = 0;
  let quantity = 0;

  // FIFO estimate using previous Buy transactions.
  for (const buy of buysBefore) {
    if (remaining <= 0) break;

    const qty = Math.min(buy.sigmaAmount, remaining);

    cost += qty * buy.rate;
    quantity += qty;
    remaining -= qty;
  }

  return quantity > 0 ? cost / quantity : 0;
}

function updateClosedTable() {
  const tbody = $("closed-body");

  if (!sellTransactions.length) {
    showMessage("closed-body", 8, "No Sell events found for this wallet.");
    return;
  }

  tbody.innerHTML = "";

  [...sellTransactions].reverse().forEach((tx, i) => {
    const date = getDate(tx.timestamp);
    const avgBuyRate = getAverageBuyRateForSell(
      tx.sigmaAmount,
      tx.timestamp
    );

    const plAmount = (tx.rate - avgBuyRate) * tx.sigmaAmount;

    const plPercent = avgBuyRate > 0
      ? ((tx.rate - avgBuyRate) / avgBuyRate) * 100
      : 0;

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${i + 1}</td>
      <td>
        ${tx.timestamp ? date.toLocaleDateString("en-GB") : "Date unavailable"}
        <div style="font-size:12px;color:#888">
          ${tx.timestamp ? date.toLocaleTimeString() : ""}
        </div>
      </td>
      <td>${tx.sigmaAmount.toFixed(4)} SIG6</td>
      <td>$${avgBuyRate.toFixed(6)}</td>
      <td>$${tx.rate.toFixed(6)}</td>
      <td>
        <span class="${plAmount >= 0 ? "pnl-positive" : "pnl-negative"}">
          $${Math.abs(plAmount).toFixed(2)}
        </span>
      </td>
      <td>
        <span class="${plPercent >= 0 ? "badge-profit" : "badge-loss"}">
          ${plPercent >= 0 ? "+" : ""}${plPercent.toFixed(2)}%
        </span>
      </td>
      <td><span class="badge badge-closed">SELL</span></td>
    `;

    const txCell = document.createElement("td");
    txCell.innerHTML = txLink(tx.hash);
    tr.appendChild(txCell);

    tbody.appendChild(tr);
  });
}

/* =============== TABLE UPDATE =============== */

function updateTables() {
  updateActiveTable();
  updateClosedTable();
}

/* =============== TABS =============== */

function showTab(tabName, event) {
  currentTab = tabName;

  document.querySelectorAll(".action-btn").forEach(btn => {
    btn.classList.remove("active");
  });

  if (event && event.currentTarget) {
    event.currentTarget.classList.add("active");
  }

  $("active-section").style.display =
    tabName === "active" ? "block" : "none";

  $("closed-section").style.display =
    tabName === "closed" ? "block" : "none";
}

/* =============== CSV EXPORT =============== */

function exportData() {
  if (!userAddress) {
    alert("Please connect wallet first.");
    return;
  }

  const data = currentTab === "active"
    ? buyTransactions
    : sellTransactions;

  if (!data.length) {
    alert("No data available to export.");
    return;
  }

  const headers = [
    "Type",
    "Date",
    "Block",
    "Sigma Quantity",
    "Rate USDT",
    "USDT Amount",
    "Transaction Hash"
  ];

  const rows = data.map(x => [
    x.type,
    x.timestamp ? new Date(x.timestamp * 1000).toISOString() : "",
    x.blockNumber,
    x.sigmaAmount,
    x.rate,
    x.usdtAmount,
    x.hash
  ]);

  const csv = [headers, ...rows]
    .map(row => row.map(value =>
      '"' + String(value ?? "").replace(/"/g, '""') + '"'
    ).join(","))
    .join("\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "Sigma_" + currentTab + "_History.csv";
  link.click();

  URL.revokeObjectURL(url);
}

/* =============== AUTO CONNECT =============== */

async function autoConnect() {
  if (!window.ethereum) return;

  try {
    const accounts = await window.ethereum.request({
      method: "eth_accounts"
    });

    if (accounts && accounts.length) {
      // Existing permission only; no popup.
      await connectWalletSilently(accounts[0]);
    }
  } catch (error) {
    console.warn("Auto connect:", error);
  }
}

async function connectWalletSilently(account) {
  try {
    const chain = await window.ethereum.request({
      method: "eth_chainId"
    });

    if (parseInt(chain, 16) !== 137) {
      setStatus("Please switch your wallet to Polygon Mainnet.");
      return;
    }

    walletProvider = new ethers.BrowserProvider(window.ethereum);
    userAddress = ethers.getAddress(account);

    initializeRPC();

    sigmaContract = new ethers.Contract(
      SIGMA_ADDR,
      ABI,
      rpcProviders[0]
    );

    $("btn-text").textContent =
      userAddress.slice(0, 6) + "..." + userAddress.slice(-4);

    $("connectBtn").classList.add("connected");

    await loadData();

  } catch (error) {
    console.error(error);
    showError(error.message);
  }
}

/* =============== WALLET EVENTS =============== */

if (window.ethereum) {
  window.ethereum.on("accountsChanged", () => {
    location.reload();
  });

  window.ethereum.on("chainChanged", () => {
    location.reload();
  });
}

/* =============== START =============== */

window.addEventListener("load", () => {
  setupProgressUI();

  if (typeof ethers === "undefined") {
    showError("Ethers library failed to load. Check internet connection.");
    return;
  }

  autoConnect();
});
</script>
