
<script>
"use strict";

/* =============== CONFIGURATION =============== */

const CONTRACT_ADDRESS = "0xaF215838d156F7d348A6d56cA962cbC680A2153F";
const START_BLOCK = 85000998;
const POLYGON_CHAIN_ID = 137n;

// No API key required
const RPC_URLS = [
  "https://polygon-bor-rpc.publicnode.com",
  "https://polygon.drpc.org"
];

// Scan settings
const INITIAL_CHUNK = 10000;
const MIN_CHUNK = 100;
const PARALLEL_REQUESTS = 4;
const TIMESTAMP_WORKERS = 8;

const ABI = [
  "function getCurrentBuyRate() view returns (uint256)",
  "function balanceOf(address) view returns (uint256)",
  "event Buy(address indexed user,uint256 amount,uint256 rate,uint256 usdtSpent)",
  "event Sell(address indexed user,uint256 amount,uint256 rate,uint256 usdtReceived)"
];

/* =============== GLOBAL VARIABLES =============== */

let rpcProviders = [];
let walletProvider = null;
let walletAddress = null;
let contract = null;

let buyData = [];
let sellData = [];

let currentRate = 0;
let currentBalance = 0;
let isLoading = false;
let currentTab = "buy";

const iface = new ethers.Interface(ABI);
const BUY_TOPIC = iface.getEvent("Buy").topicHash;
const SELL_TOPIC = iface.getEvent("Sell").topicHash;

const $ = id => document.getElementById(id);

/* =============== RPC INITIALIZATION =============== */

function initializeRPC() {
  rpcProviders = RPC_URLS.map(url =>
    new ethers.JsonRpcProvider(url, 137)
  );
}

// Try each RPC until one succeeds
async function rpcCall(callback) {
  let lastError;

  for (const rpc of rpcProviders) {
    try {
      return await callback(rpc);
    } catch (error) {
      lastError = error;
      console.warn("RPC failed, trying backup:", error.message);
    }
  }

  throw lastError || new Error("All Polygon RPC servers failed.");
}

/* =============== HELPERS =============== */

function numberFormat(value, decimals = 4) {
  return Number(value || 0).toLocaleString("en-US", {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  });
}

function setStatus(message) {
  $("scanStatus").textContent = message;
}

function setProgress(percent, message) {
  const p = Math.max(0, Math.min(100, percent));

  $("progressBar").style.width = p + "%";
  $("progressText").textContent = p.toFixed(1) + "%";

  if (message) setStatus(message);
}

function showMessage(id, columns, message, error = false) {
  const body = $(id);
  body.innerHTML = "";

  const tr = document.createElement("tr");
  const td = document.createElement("td");

  td.colSpan = columns;
  td.className = error ? "loading error" : "loading";
  td.textContent = message;

  tr.appendChild(td);
  body.appendChild(tr);
}

/* =============== WALLET CONNECTION =============== */

async function connectWallet() {
  try {
    if (!window.ethereum) {
      alert("Please install MetaMask or another compatible wallet.");
      return;
    }

    const accounts = await window.ethereum.request({
      method: "eth_requestAccounts"
    });

    if (!accounts.length) {
      throw new Error("Wallet account not found.");
    }

    let network = await window.ethereum.request({
      method: "eth_chainId"
    });

    if (network !== "0x89") {
      try {
        await window.ethereum.request({
          method: "wallet_switchEthereumChain",
          params: [{ chainId: "0x89" }]
        });
      } catch (switchError) {
        throw new Error("Please switch your wallet to Polygon Mainnet.");
      }
    }

    walletAddress = ethers.getAddress(accounts[0]);

    walletProvider = new ethers.BrowserProvider(window.ethereum);

    initializeRPC();

    contract = new ethers.Contract(
      CONTRACT_ADDRESS,
      ABI,
      rpcProviders[0]
    );

    $("connectText").textContent =
      walletAddress.slice(0, 6) + "..." + walletAddress.slice(-4);

    $("connectBtn").classList.add("connected");

    $("walletInfo").textContent =
      "Connected Wallet: " + walletAddress +
      " | Sigma Contract: " + CONTRACT_ADDRESS;

    await loadData();

  } catch (error) {
    console.error(error);
    alert("Wallet connection error: " + error.message);
  }
}

/* =============== CACHE =============== */

function cacheKey() {
  return "SIGMA_HISTORY_V3_" + walletAddress.toLowerCase();
}

function readCache() {
  try {
    const raw = localStorage.getItem(cacheKey());

    if (!raw) return null;

    const data = JSON.parse(raw);

    if (
      !data ||
      !Array.isArray(data.buy) ||
      !Array.isArray(data.sell) ||
      data.startBlock !== START_BLOCK
    ) {
      return null;
    }

    return data;

  } catch (error) {
    console.warn("Cache read failed:", error);
    return null;
  }
}

function saveCache(lastBlock) {
  try {
    const data = {
      startBlock: START_BLOCK,
      lastBlock,
      buy: buyData,
      sell: sellData
    };

    localStorage.setItem(cacheKey(), JSON.stringify(data));

  } catch (error) {
    console.warn("Cache could not be saved:", error);
    setStatus("History loaded, but browser cache could not be saved.");
  }
}

/* =============== CONTRACT EVENT FILTER =============== */

function makeFilter(fromBlock, toBlock) {
  return {
    address: CONTRACT_ADDRESS,

    fromBlock: ethers.toQuantity(fromBlock),
    toBlock: ethers.toQuantity(toBlock),

    topics: [
      [BUY_TOPIC, SELL_TOPIC],
      ethers.zeroPadValue(walletAddress, 32)
    ]
  };
}

/* =============== EVENT DECODING =============== */

function decodeLog(log) {
  const parsed = iface.parseLog({
    topics: log.topics,
    data: log.data
  });

  if (!parsed) return null;

  const isBuy = parsed.name === "Buy";
  const a = parsed.args;

  return {
    type: isBuy ? "buy" : "sell",
    hash: log.transactionHash,
    blockNumber: Number(log.blockNumber),
    index: Number(log.index ?? log.logIndex ?? 0),

    sigmaAmount: Number(
      ethers.formatUnits(a.amount, 18)
    ),

    rate: Number(
      ethers.formatUnits(a.rate, 6)
    ),

    usdtAmount: Number(
      ethers.formatUnits(
        isBuy ? a.usdtSpent : a.usdtReceived,
        6
      )
    ),

    timestamp: 0
  };
}

/* =============== FAST RPC LOG REQUEST =============== */

async function fetchRange(from, to) {
  const filter = makeFilter(from, to);

  return await rpcCall(async rpc => {
    const logs = await rpc.getLogs(filter);

    return logs
      .map(decodeLog)
      .filter(Boolean);
  });
}

/* =============== PARALLEL HISTORY SCAN =============== */

async function scanFullHistory(fromBlock, toBlock) {
  let ranges = [];

  for (
    let start = fromBlock;
    start <= toBlock;
    start += INITIAL_CHUNK
  ) {
    ranges.push({
      from: start,
      to: Math.min(start + INITIAL_CHUNK - 1, toBlock)
    });
  }

  const totalBlocks = toBlock - fromBlock + 1;

  let completedBlocks = 0;
  let allLogs = [];

  while (ranges.length > 0) {
    const batch = ranges.splice(0, PARALLEL_REQUESTS);

    const results = await Promise.all(
      batch.map(async range => {
        try {
          const logs = await fetchRange(range.from, range.to);

          return {
            success: true,
            range,
            logs
          };

        } catch (error) {
          return {
            success: false,
            range,
            error
          };
        }
      })
    );

    for (const result of results) {
      const r = result.range;
      const size = r.to - r.from + 1;

      if (result.success) {
        allLogs.push(...result.logs);
        completedBlocks += size;

      } else {
        // Split a rejected range into smaller ranges
        if (size <= MIN_CHUNK) {
          throw new Error(
            "RPC failed near block " + r.from +
            ". Please refresh and try again."
          );
        }

        const mid = Math.floor((r.from + r.to) / 2);

        ranges.push(
          { from: r.from, to: mid },
          { from: mid + 1, to: r.to }
        );
      }
    }

    const percent = (completedBlocks / totalBlocks) * 100;

    setProgress(
      percent,
      "Scanning Sigma events: " +
      completedBlocks.toLocaleString() +
      " / " +
      totalBlocks.toLocaleString() +
      " blocks"
    );
  }

  return allLogs;
}

/* =============== BLOCK TIMESTAMPS =============== */

async function addTimestamps(events) {
  const blocks = [
    ...new Set(events.map(x => x.blockNumber))
  ];

  const timestamps = new Map();

  let next = 0;

  const workers = Array.from(
    { length: TIMESTAMP_WORKERS },
    async () => {
      while (next < blocks.length) {
        const blockNo = blocks[next++];

        try {
          const block = await rpcCall(
            rpc => rpc.getBlock(blockNo)
          );

          timestamps.set(
            blockNo,
            block ? Number(block.timestamp) : 0
          );

        } catch (error) {
          timestamps.set(blockNo, 0);
          console.warn("Timestamp unavailable:", blockNo);
        }
      }
    }
  );

  await Promise.all(workers);

  for (const event of events) {
    event.timestamp = timestamps.get(event.blockNumber) || 0;
  }
}

/* =============== MAIN HISTORY LOADER =============== */

async function loadData() {
  if (!walletAddress || !rpcProviders.length || !contract) {
    alert("Please connect wallet first.");
    return;
  }

  if (isLoading) return;

  isLoading = true;

  try {
    showMessage("buyBody", 6, "Loading Buy History...");
    showMessage("sellBody", 6, "Loading Sell History...");

    setProgress(0, "Connecting to Polygon RPC...");

    const walletNetwork = await walletProvider.getNetwork();

    if (walletNetwork.chainId !== POLYGON_CHAIN_ID) {
      throw new Error("Please connect to Polygon Mainnet.");
    }

    const latestBlock = await rpcCall(
      rpc => rpc.getBlockNumber()
    );

    // Read contract values
    const [rateRaw, balanceRaw] = await rpcCall(
      async rpc => {
        const readContract = new ethers.Contract(
          CONTRACT_ADDRESS,
          ABI,
          rpc
        );

        return await Promise.all([
          readContract.getCurrentBuyRate(),
          readContract.balanceOf(walletAddress)
        ]);
      }
    );

    currentRate = Number(
      ethers.formatUnits(rateRaw, 6)
    );

    currentBalance = Number(
      ethers.formatUnits(balanceRaw, 18)
    );

    $("currentRate").textContent =
      "$" + numberFormat(currentRate, 6);

    // Load cached history
    const cache = readCache();

    if (cache) {
      buyData = cache.buy || [];
      sellData = cache.sell || [];
    } else {
      buyData = [];
      sellData = [];
    }

    const scanFrom = cache
      ? Math.max(START_BLOCK, Number(cache.lastBlock) + 1)
      : START_BLOCK;

    if (scanFrom <= latestBlock) {
      $("scanDetail").textContent =
        "Scanning from block " +
        scanFrom.toLocaleString() +
        " to " +
        latestBlock.toLocaleString();

      const newEvents = await scanFullHistory(
        scanFrom,
        latestBlock
      );

      const newBuys = newEvents.filter(
        x => x.type === "buy"
      );

      const newSells = newEvents.filter(
        x => x.type === "sell"
      );

      // Fetch timestamps only for new event blocks
      await addTimestamps(newEvents);

      buyData.push(...newBuys);
      sellData.push(...newSells);

      // Save only after successful scan
      saveCache(latestBlock);

    } else {
      setProgress(100, "History already up to date");

      $("scanDetail").textContent =
        "Cached history is up to date at block " +
        latestBlock.toLocaleString();
    }

    // Sort old to new
    buyData.sort(
      (a, b) => a.blockNumber - b.blockNumber || a.index - b.index
    );

    sellData.sort(
      (a, b) => a.blockNumber - b.blockNumber || a.index - b.index
    );

    updateStats();
    renderTables();

    setProgress(100, "Complete");
    setStatus("History loaded successfully.");

    $("scanDetail").textContent =
      "Contract start: " + START_BLOCK.toLocaleString() +
      " | Latest block: " + latestBlock.toLocaleString() +
      " | Buy events: " + buyData.length +
      " | Sell events: " + sellData.length;

  } catch (error) {
    console.error("History loading error:", error);

    setStatus("History scan failed");

    showMessage("buyBody", 6, error.message, true);
    showMessage("sellBody", 6, error.message, true);

  } finally {
    isLoading = false;
  }
}

/* =============== STATISTICS =============== */

function updateStats() {
  const totalBuy = buyData.reduce(
    (s, x) => s + x.sigmaAmount, 0
  );

  const totalBuyUSDT = buyData.reduce(
    (s, x) => s + x.usdtAmount, 0
  );

  const totalSell = sellData.reduce(
    (s, x) => s + x.sigmaAmount, 0
  );

  const totalSellUSDT = sellData.reduce(
    (s, x) => s + x.usdtAmount, 0
  );

  $("totalBought").textContent =
    numberFormat(totalBuy, 2) + " SIG6";

  $("buyValue").textContent =
    "$" + numberFormat(totalBuyUSDT, 2) + " USDT";

  $("totalSold").textContent =
    numberFormat(totalSell, 2) + " SIG6";

  $("sellValue").textContent =
    "$" + numberFormat(totalSellUSDT, 2) + " USDT";

  $("holdings").textContent =
    numberFormat(currentBalance, 4) + " SIG6";

  $("holdingValue").textContent =
    "$" + numberFormat(currentBalance * currentRate, 2) + " USDT";
}

/* =============== TABLE HELPERS =============== */

function txLink(hash) {
  const a = document.createElement("a");

  a.className = "txlink";
  a.target = "_blank";
  a.rel = "noopener";
  a.href = "https://polygonscan.com/tx/" + hash;
  a.textContent = "View Tx";

  return a;
}

function formatDate(timestamp) {
  if (!timestamp) return "Date unavailable";

  return new Date(timestamp * 1000).toLocaleString();
}

/* =============== BUY TABLE =============== */

function renderBuyTable() {
  const body = $("buyBody");
  body.innerHTML = "";

  if (!buyData.length) {
    showMessage("buyBody", 6, "No Buy events found for this wallet.");
    return;
  }

  [...buyData].reverse().forEach((x, i) => {
    const tr = document.createElement("tr");

    const values = [
      i + 1,
      formatDate(x.timestamp),
      numberFormat(x.sigmaAmount, 4) + " SIG6",
      "$" + numberFormat(x.rate, 6),
      "$" + numberFormat(x.usdtAmount, 4)
    ];

    values.forEach(value => {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    const txTd = document.createElement("td");
    txTd.appendChild(txLink(x.hash));
    tr.appendChild(txTd);

    body.appendChild(tr);
  });
}

/* =============== SELL TABLE =============== */

function renderSellTable() {
  const body = $("sellBody");
  body.innerHTML = "";

  if (!sellData.length) {
    showMessage("sellBody", 6, "No Sell events found for this wallet.");
    return;
  }

  [...sellData].reverse().forEach((x, i) => {
    const tr = document.createElement("tr");

    const values = [
      i + 1,
      formatDate(x.timestamp),
      numberFormat(x.sigmaAmount, 4) + " SIG6",
      "$" + numberFormat(x.rate, 6),
      "$" + numberFormat(x.usdtAmount, 4)
    ];

    values.forEach(value => {
      const td = document.createElement("td");
      td.textContent = value;
      tr.appendChild(td);
    });

    const txTd = document.createElement("td");
    txTd.appendChild(txLink(x.hash));
    tr.appendChild(txTd);

    body.appendChild(tr);
  });
}

function renderTables() {
  renderBuyTable();
  renderSellTable();
}

/* =============== TABS =============== */

function showTab(tab) {
  currentTab = tab;

  $("buyPanel").style.display =
    tab === "buy" ? "block" : "none";

  $("sellPanel").style.display =
    tab === "sell" ? "block" : "none";

  $("buyTab").classList.toggle("active", tab === "buy");
  $("sellTab").classList.toggle("active", tab === "sell");
}

/* =============== CSV EXPORT =============== */

function exportCSV() {
  if (!walletAddress) {
    alert("Connect wallet first.");
    return;
  }

  const data = currentTab === "buy" ? buyData : sellData;

  if (!data.length) {
    alert("No history available to export.");
    return;
  }

  const headers = [
    "Type",
    "Date",
    "Block Number",
    "Sigma Quantity",
    "Rate USDT",
    "USDT Amount",
    "Transaction Hash"
  ];

  const rows = data.map(x => [
    x.type,
    formatDate(x.timestamp),
    x.blockNumber,
    x.sigmaAmount,
    x.rate,
    x.usdtAmount,
    x.hash
  ]);

  const csv = [headers, ...rows]
    .map(row =>
      row.map(v =>
        '"' + String(v).replace(/"/g, '""') + '"'
      ).join(",")
    )
    .join("\n");

  const blob = new Blob(["\uFEFF" + csv], {
    type: "text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");

  a.href = url;
  a.download = "Sigma_" + currentTab + "_History.csv";
  a.click();

  URL.revokeObjectURL(url);
}

/* =============== AUTO CONNECT =============== */

async function autoConnect() {
  if (!window.ethereum) return;

  try {
    const accounts = await window.ethereum.request({
      method: "eth_accounts"
    });

    if (accounts && accounts.length) {
      await connectWallet();
    }
  } catch (error) {
    console.warn("Auto connection:", error);
  }
}

if (window.ethereum) {
  window.ethereum.on("accountsChanged", () => location.reload());
  window.ethereum.on("chainChanged", () => location.reload());
}

window.addEventListener("load", () => {
  if (typeof ethers === "undefined") {
    setStatus("Ethers library failed to load. Check internet connection.");
    return;
  }

  autoConnect();
});
</script>
